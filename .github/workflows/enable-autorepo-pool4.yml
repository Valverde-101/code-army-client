name: Enable Auto-Repo pool 4

on:
  push:
    branches:
      - chore/local-army-bootstrap-20260827
    paths:
      - Tools/CI/Enable-AutoRepoPool4.ps1
      - Tools/CI/Start-AutoRepoPool4.runtime.ps1
      - .github/workflows/enable-autorepo-pool4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    name: Enable four Auto-Repo brokers
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve AndroidBuild root
        shell: powershell
        run: |
          $root=$null
          foreach($drive in Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue){
            if($drive.Root){
              $candidate=Join-Path $drive.Root 'AndroidBuild'
              if(Test-Path -LiteralPath (Join-Path $candidate 'PC-LAUNCHER\Launcher\Core\AndroidBuild.AutoRepo.psm1')){$root=$candidate;break}
            }
          }
          if(-not $root){throw 'ANDROIDBUILD_ROOT=FAIL'}
          "ANDROIDBUILD_ROOT=$root"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ANDROIDBUILD_ROOT=PASS root=$root"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
      - name: Enable Auto-Repo pool 4
        shell: powershell
        run: |
          & '.\Tools\CI\Enable-AutoRepoPool4.ps1' -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -Slots 4
