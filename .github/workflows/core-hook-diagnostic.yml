name: AndroidBuild Core hook path probe

on:
  push:
    branches:
      - 'infra-diagnose/**'

permissions:
  contents: read

concurrency:
  group: army-attack-core-build
  cancel-in-progress: false

jobs:
  inspect:
    name: Probe real Core hook with a temporary no-op project
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect AndroidBuild Core command resolution
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=@($env:ANDROIDBUILD_ROOT,'V:\AndroidBuild','D:\AndroidBuild','C:\AndroidBuild')|Where-Object{$_ -and (Test-Path -LiteralPath $_ -PathType Container)}|Select-Object -First 1
          if(-not $root){throw 'CORE_DIAGNOSTIC=FAIL root_missing'}
          $root=(Resolve-Path -LiteralPath $root).Path
          $manifest=Join-Path $root 'Core\Current\AndroidBuild.psd1'
          Import-Module $manifest -DisableNameChecking -Force
          Write-Host "CORE_DIAGNOSTIC_VERSION=$([string](Get-AndroidBuildCoreVersion))"
          $coreRollbackPath=Join-Path $root 'Core\.rollback\previous\AndroidBuild.psd1'
          $coreRollback=if(Test-Path -LiteralPath $coreRollbackPath){[string](Import-PowerShellDataFile -LiteralPath $coreRollbackPath).ModuleVersion}else{'MISSING'}
          $skillRoot=Join-Path $root 'Skills\androidbuild-physical-ci-orchestrator'
          $skillCurrent=Get-AndroidBuildLocalSkillVersion -AndroidBuildRoot $root
          $skillRollbackPath=Join-Path $skillRoot '.rollback\previous\SKILL-PACKAGE.json'
          $skillRollback=if(Test-Path -LiteralPath $skillRollbackPath){[string](Get-Content -LiteralPath $skillRollbackPath -Raw|ConvertFrom-Json).version}else{'MISSING'}
          Write-Host "CORE_DIAGNOSTIC_UPDATE_STATE core_current=$([string](Get-AndroidBuildCoreVersion)) core_rollback=$coreRollback skill_current=$skillCurrent skill_rollback=$skillRollback"
          $modules=@(Get-Module|Where-Object{$_.Name -like '*AndroidBuild*'})
          foreach($module in $modules){Write-Host "CORE_DIAGNOSTIC_MODULE name=$($module.Name) version=$($module.Version) path=$($module.Path)"}
          $commands=@(Get-Command Invoke-AndroidBuildProjectHook -All -ErrorAction SilentlyContinue)
          Write-Host "CORE_DIAGNOSTIC_HOOK_COMMAND_COUNT=$($commands.Count)"
          foreach($command in $commands){
            $origin=''
            try{$origin=[string]$command.ScriptBlock.File}catch{}
            $sets=@()
            try{$sets=@($command.ParameterSets|ForEach-Object{$parameters=($_.Parameters|ForEach-Object{$_.Name}) -join ',';"$($_.Name)=$parameters"})}catch{}
            Write-Host "CORE_DIAGNOSTIC_HOOK_COMMAND type=$($command.CommandType) module=$($command.ModuleName) source=$($command.Source) origin=$origin parameter_sets=$($sets -join '|')"
          }
          $git=Get-AndroidBuildGitPath $root
          $expected=@{
            'Core\Current\Adapters\Invoke-ProjectHook.ps1'='b6532ce0a703f39282f2c0c92d607448e3134ab3'
            'Core\Current\Adapters\Invoke-Build.ps1'='11247132b0d7ae2d1038583ce98d89d4b74c47d6'
          }
          foreach($relative in $expected.Keys){
            $path=Join-Path $root $relative
            if(-not(Test-Path -LiteralPath $path -PathType Leaf)){throw "CORE_DIAGNOSTIC=FAIL file_missing=$relative"}
            $actual=(& $git hash-object $path).Trim()
            if($LASTEXITCODE -ne 0){throw "CORE_DIAGNOSTIC=FAIL git_hash_object=$relative"}
            $match=($actual -eq $expected[$relative])
            Write-Host "CORE_DIAGNOSTIC_FILE path=$relative blob=$actual canonical_match=$match"
          }
          $module=Get-Module AndroidBuild|Select-Object -First 1
          foreach($scope in @('global','module')){
            $describe={param($scopeName) foreach($cmd in @(Get-Command New-Item -All)){
              $sets=@();try{$sets=@($cmd.ParameterSets|ForEach-Object{$n=($_.Parameters|ForEach-Object{$_.Name}) -join ',';"$($_.Name)=$n"})}catch{}
              Write-Host "CORE_DIAGNOSTIC_NEWITEM scope=$scopeName type=$($cmd.CommandType) name=$($cmd.Name) source=$($cmd.Source) module=$($cmd.ModuleName) sets=$($sets -join '|')"
            }}
            if($scope -eq 'module'){& $module $describe $scope}else{& $describe $scope}
          }
          $newItemTest=Join-Path $env:TEMP ('army-core-newitem-'+[guid]::NewGuid().ToString('N'))
          try{New-Item -ItemType Directory -Force -Path $newItemTest|Out-Null;Write-Host 'CORE_DIAGNOSTIC_NEWITEM_TEST scope=global result=PASS'}catch{Write-Host "CORE_DIAGNOSTIC_NEWITEM_TEST scope=global error_id=$($_.FullyQualifiedErrorId) type=$($_.Exception.GetType().FullName) stack=$($_.ScriptStackTrace)"}
          try{& $module {param($path) New-Item -ItemType Directory -Force -Path $path|Out-Null} $newItemTest;Write-Host 'CORE_DIAGNOSTIC_NEWITEM_TEST scope=module result=PASS'}catch{Write-Host "CORE_DIAGNOSTIC_NEWITEM_TEST scope=module error_id=$($_.FullyQualifiedErrorId) type=$($_.Exception.GetType().FullName) stack=$($_.ScriptStackTrace)"}
          if(Test-Path -LiteralPath $newItemTest){Remove-Item -LiteralPath $newItemTest -Force}
          $probeRepo=Join-Path $env:TEMP ('army-core-hook-probe-'+[guid]::NewGuid().ToString('N'))
          try{
            New-Item -ItemType Directory -Force -Path $probeRepo|Out-Null
            $exactContextPath=Join-Path $probeRepo '.work\state\hook-build-context.json'
            $exactContextParent=[IO.Path]::GetDirectoryName($exactContextPath)
            Write-Host "CORE_DIAGNOSTIC_CONTEXT_PATH type=$($exactContextParent.GetType().FullName) value=$exactContextParent"
            try{New-Item -ItemType Directory -Force -Path $exactContextParent|Out-Null;Write-Host 'CORE_DIAGNOSTIC_CONTEXT_NEWITEM scope=global result=PASS'}catch{Write-Host "CORE_DIAGNOSTIC_CONTEXT_NEWITEM scope=global error_id=$($_.FullyQualifiedErrorId) type=$($_.Exception.GetType().FullName) message=$($_.Exception.Message)"}
            $exactState=[IO.Path]::GetDirectoryName($exactContextParent)
            if(Test-Path -LiteralPath $exactState){Remove-Item -LiteralPath $exactState -Recurse -Force}
            try{& $module {param($path) New-Item -ItemType Directory -Force -Path $path|Out-Null} $exactContextParent;Write-Host 'CORE_DIAGNOSTIC_CONTEXT_NEWITEM scope=module result=PASS'}catch{Write-Host "CORE_DIAGNOSTIC_CONTEXT_NEWITEM scope=module error_id=$($_.FullyQualifiedErrorId) type=$($_.Exception.GetType().FullName) message=$($_.Exception.Message)"}
            if(Test-Path -LiteralPath $exactState){Remove-Item -LiteralPath $exactState -Recurse -Force}
            $sourceConfig=Join-Path $root 'Repositories\code-army-client\.androidbuild.json'
            $probeConfig=Get-Content -LiteralPath $sourceConfig -Raw|ConvertFrom-Json
            $probeConfig.hooks.build='probe.ps1'
            $probeScript=@(
              'param([Parameter(Mandatory=$true)][string]$ContextPath)'
              '$ErrorActionPreference=''Stop'''
              'if(-not(Test-Path -LiteralPath $ContextPath)){throw ''CORE_DIAGNOSTIC_PROBE=FAIL context_missing''}'
              'Write-Host ''CORE_DIAGNOSTIC_PROBE_HOOK=PASS'''
            )
            $probeScript|Set-Content -LiteralPath (Join-Path $probeRepo 'probe.ps1') -Encoding UTF8
            $probeConfig|ConvertTo-Json -Depth 60|Set-Content -LiteralPath (Join-Path $probeRepo '.androidbuild.json') -Encoding UTF8
            $probeContext=@{repo_root=$probeRepo;source_root=$probeRepo;project_root=$probeRepo;androidbuild_root=$root;expected_sha=('f'*40)}
            try{
              $probeResult=Invoke-AndroidBuildProjectHook -RepoRoot $probeRepo -Hook 'build' -Context $probeContext -TimeoutSeconds 1800
              Write-Host "CORE_DIAGNOSTIC_BIND_PROBE scope=global status=$($probeResult.status) reason=$($probeResult.reason)"
            }catch{Write-Host "CORE_DIAGNOSTIC_BIND_PROBE scope=global error_id=$($_.FullyQualifiedErrorId) category=$($_.CategoryInfo.Category) type=$($_.Exception.GetType().FullName) target=$($_.TargetObject) stack=$($_.ScriptStackTrace) message=$($_.Exception.Message)"}
            try{
              $module=Get-Module AndroidBuild|Select-Object -First 1
              $probeResult=& $module {param($repo,$ctx) Invoke-AndroidBuildProjectHook -RepoRoot $repo -Hook 'build' -Context $ctx -TimeoutSeconds 1800} $probeRepo $probeContext
              Write-Host "CORE_DIAGNOSTIC_BIND_PROBE scope=module status=$($probeResult.status) reason=$($probeResult.reason)"
            }catch{Write-Host "CORE_DIAGNOSTIC_BIND_PROBE scope=module error_id=$($_.FullyQualifiedErrorId) category=$($_.CategoryInfo.Category) message=$($_.Exception.Message)"}
          }finally{if(Test-Path -LiteralPath $probeRepo){Remove-Item -LiteralPath $probeRepo -Recurse -Force}}
          if(Get-Command Test-AndroidBuildUpdateQuiescence -ErrorAction SilentlyContinue){
            $q=Test-AndroidBuildUpdateQuiescence -AndroidBuildRoot $root
            Write-Host "CORE_DIAGNOSTIC_QUIESCENCE quiescent=$($q.quiescent)"
          }
          Write-Host 'CORE_DIAGNOSTIC=PASS hook_path_probe_completed';


