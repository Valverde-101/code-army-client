name: Army Attack NORMAL APK clean main 20260926

on:
  push:
    branches:
      - build/normal-apk-main-20260926
    paths:
      - '.github/workflows/android-normal-apk.yml'

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  classify:
    name: Classify latest candidate delta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_candidate: ${{ steps.classify.outputs.run_candidate }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact PR HEAD for delta classification
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Classify latest HEAD delta
        id: classify
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            "run_candidate=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "CANDIDATE_TRIGGER_CLASS=PUSH_OR_DISPATCH run_candidate=true sha=$env:HEAD_SHA"
            exit 0
          }

          $head=(git rev-parse HEAD).Trim()
          if ($head -ne $env:HEAD_SHA) { throw "CANDIDATE_TRIGGER_CLASS=FAIL exact_head expected=$env:HEAD_SHA actual=$head" }
          $parent=(git rev-parse HEAD^).Trim()
          if (-not $parent) { throw 'CANDIDATE_TRIGGER_CLASS=FAIL parent_missing' }
          $changed=@(git -c core.quotepath=false diff --name-only $parent $head | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($changed.Count -eq 0) { throw 'CANDIDATE_TRIGGER_CLASS=FAIL no_head_delta' }
          $sourceChanges=@($changed | Where-Object { $_ -notlike 'Logs/*' })
          if ($sourceChanges.Count -eq 0) {
            "run_candidate=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "CANDIDATE_TRIGGER_CLASS=EVIDENCE_ONLY_HEAD_DELTA run_candidate=false head=$head parent=$parent files=$($changed.Count)"
            exit 0
          }
          "run_candidate=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "CANDIDATE_TRIGGER_CLASS=SOURCE_HEAD_DELTA run_candidate=true head=$head parent=$parent source_files=$($sourceChanges.Count) total_files=$($changed.Count)"

      - name: Drain stale queued candidates without touching lease holders
        if: steps.classify.outputs.run_candidate == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $current=[int64]$env:GITHUB_RUN_ID
          $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?per_page=100"
          $response=Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
          $stale=@($response.workflow_runs|Where-Object{
            $_.name -eq 'Army Attack Android candidate' -and
            [string]$_.head_branch -eq $env:SOURCE_BRANCH -and
            [int64]$_.id -lt $current -and
            [string]$_.status -in @('queued','pending')
          })
          $cancelled=0
          foreach($run in $stale){
            try{
              Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/cancel" -Method Post|Out-Null
              $cancelled++
              Write-Host "STALE_QUEUED_CANCELLED run=$($run.id) sha=$($run.head_sha) status=$($run.status)"
            }catch{
              Write-Host "STALE_QUEUED_CANCEL_RACE run=$($run.id) message=$($_.Exception.Message)"
            }
          }
          Write-Host "STALE_QUEUED_DRAIN=PASS cancelled=$cancelled in_progress_untouched=true branch=$env:SOURCE_BRANCH"

          # Rescue a single known obsolete main run that is holding the GLOBAL build
          # concurrency slot, although it has never acquired a runner or build lease.
          # Never cancel a run if any job has started or the identity changed.
          if($env:SOURCE_BRANCH -ne 'build/normal-apk-main-20260926'){throw 'NORMAL_RESCUE=FAIL unexpected_branch'}
          $blockedRunId=36176558182
          $blockedJobId=108402926061
          $baseline='2d10485efba78565b4b11873a7d7279b125f557f'
          $old=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$blockedRunId"
          if([int64]$old.id -ne $blockedRunId -or [string]$old.head_sha -ne $baseline -or [string]$old.head_branch -ne 'main'){
            throw 'NORMAL_RESCUE=FAIL obsolete_run_identity_mismatch'
          }
          if([string]$old.status -eq 'completed'){
            Write-Host "NORMAL_RESCUE=PASS prior_run_already_completed conclusion=$($old.conclusion)"
          }else{
            if([string]$old.status -notin @('queued','pending')){throw "NORMAL_RESCUE=FAIL prior_run_active status=$($old.status)"}
            $job=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/jobs/$blockedJobId"
            if([int64]$job.id -ne $blockedJobId -or [string]$job.run_id -ne [string]$blockedRunId){
              throw 'NORMAL_RESCUE=FAIL obsolete_job_identity_mismatch'
            }
            if([string]$job.status -notin @('queued','pending') -or [int64]$job.runner_id -ne 0 -or -not [string]::IsNullOrWhiteSpace([string]$job.runner_name) -or @($job.steps).Count -ne 0){
              throw "NORMAL_RESCUE=FAIL do_not_cancel_assigned_job status=$($job.status) runner=$($job.runner_name) steps=$(@($job.steps).Count)"
            }
            Write-Host "NORMAL_RESCUE=CONFIRMED old_run=$blockedRunId old_job=$blockedJobId runner_id=0 steps=0 sha=$baseline"
            Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$blockedRunId/cancel" -Method Post|Out-Null
            $cancelledOld=$false
            foreach($poll in 1..8){
              $old=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$blockedRunId"
              if([string]$old.status -eq 'completed' -and [string]$old.conclusion -eq 'cancelled'){$cancelledOld=$true;break}
              Start-Sleep -Seconds 4
            }
            if(-not $cancelledOld){throw "NORMAL_RESCUE=FAIL cancel_not_confirmed status=$($old.status) conclusion=$($old.conclusion)"}
            Write-Host "NORMAL_RESCUE=PASS cancelled_obsolete_run=$blockedRunId build_lease_never_acquired=true"
          }

          # The previous NORMAL workflow shares the same concurrency group and can
          # itself become a stale unassigned blocker. Cancel ONLY older runs of this
          # exact workflow on this exact isolated branch when the build job has zero
          # runner and zero steps. Do not cancel running jobs or touch other projects.
          $staleNormal=@($response.workflow_runs|Where-Object{
            [string]$_.name -eq 'Army Attack NORMAL APK clean main 20260926' -and
            [string]$_.head_branch -eq 'build/normal-apk-main-20260926' -and
            [int64]$_.id -lt $current -and
            [string]$_.head_sha -ne $env:HEAD_SHA -and
            [string]$_.status -in @('queued','pending')
          })
          foreach($run in $staleNormal){
            $jobData=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/jobs?per_page=100"
            $buildJobs=@($jobData.jobs|Where-Object{[string]$_.name -eq 'Core candidate build and validation'})
            if($buildJobs.Count -ne 1){throw "NORMAL_STALE_DRAIN=FAIL run=$($run.id) candidate_job_count=$($buildJobs.Count)"}
            $build=$buildJobs[0]
            $jobSteps=@($build.steps|Where-Object{$null -ne $_})
            if([string]$build.status -notin @('queued','pending') -or [int64]$build.runner_id -ne 0 -or -not [string]::IsNullOrWhiteSpace([string]$build.runner_name) -or $jobSteps.Count -ne 0){
              throw "NORMAL_STALE_DRAIN=FAIL old_job_assigned run=$($run.id) job=$($build.id) status=$($build.status) runner=$($build.runner_name) steps=$($jobSteps.Count)"
            }
            # Recheck the run immediately before cancel to avoid a scheduling race.
            $fresh=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)"
            if([string]$fresh.status -notin @('queued','pending') -or [string]$fresh.head_sha -ne [string]$run.head_sha){throw "NORMAL_STALE_DRAIN=FAIL run_identity_or_state_changed run=$($run.id)"}
            Write-Host "NORMAL_STALE_DRAIN=CONFIRMED obsolete_run=$($run.id) job=$($build.id) sha=$($run.head_sha) runner_id=0 steps=0"
            Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/cancel" -Method Post|Out-Null
            $done=$false
            foreach($poll in 1..8){
              $fresh=Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)"
              if([string]$fresh.status -eq 'completed' -and [string]$fresh.conclusion -eq 'cancelled'){$done=$true;break}
              Start-Sleep -Seconds 4
            }
            if(-not $done){throw "NORMAL_STALE_DRAIN=FAIL cancel_not_confirmed run=$($run.id) status=$($fresh.status)"}
            Write-Host "NORMAL_STALE_DRAIN=PASS cancelled_run=$($run.id) runner_never_claimed=true"
          }
          Write-Host "NORMAL_STALE_DRAIN=PASS older_unassigned=$($staleNormal.Count) preserved_main=true"

  candidate:
    name: Core candidate build and validation
    needs: classify
    if: needs.classify.outputs.run_candidate == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: army-attack-core-build
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      BASELINE_MAIN_SHA: 2d10485efba78565b4b11873a7d7279b125f557f
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Enable AndroidBuild Core 3.0.11+ APK-FINAL delivery
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=@($env:ANDROIDBUILD_ROOT,'V:\AndroidBuild','D:\AndroidBuild','C:\AndroidBuild')|Where-Object{$_ -and (Test-Path -LiteralPath $_ -PathType Container)}|Select-Object -First 1
          if(-not $root){throw 'CORE_PRECHECK=FAIL androidbuild_root_not_found'}
          $root=(Resolve-Path -LiteralPath $root).Path
          Import-Module (Join-Path $root 'Core\Current\AndroidBuild.psd1') -DisableNameChecking -Force
          $core=[version](Get-AndroidBuildCoreVersion)
          if($core -lt [version]'3.0.11'){throw "CORE_PRECHECK=FAIL version=$core minimum=3.0.11 apk_final_delivery=required"}
          foreach($name in @('Resolve-AndroidBuildFlashToolchain','Ensure-AndroidBuildFFDec','Invoke-AndroidBuildCandidateValidation','Invoke-AndroidBuildProcess')){if(-not(Get-Command $name -ErrorAction SilentlyContinue)){throw "CORE_PRECHECK=FAIL capability=$name"}}
          Enable-AndroidBuildPortableTools -AndroidBuildRoot $root|Out-Null
          $git=Get-AndroidBuildGitPath $root
          (Split-Path -Parent $git)|Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "ANDROIDBUILD_ROOT=$root"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CORE_PRECHECK=PASS version=$core minimum=3.0.11 apk_final_delivery=candidate_validated git=$git"

      - name: Bootstrap exact source without codeload
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          Import-Module (Join-Path $env:ANDROIDBUILD_ROOT 'Core\Current\AndroidBuild.psd1') -DisableNameChecking -Force
          $git=Get-AndroidBuildGitPath $env:ANDROIDBUILD_ROOT
          $workspace=$PWD.Path
          & $git config --global --add safe.directory $workspace
          if(-not(Test-Path -LiteralPath (Join-Path $workspace '.git'))){& $git init $workspace|Out-Host;if($LASTEXITCODE -ne 0){throw 'SOURCE_BOOTSTRAP=FAIL git_init'}}
          $repoUrl="https://github.com/$env:GITHUB_REPOSITORY.git"
          & $git -C $workspace remote get-url origin *> $null
          if($LASTEXITCODE -eq 0){& $git -C $workspace remote set-url origin $repoUrl}else{& $git -C $workspace remote add origin $repoUrl}
          if([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)){throw 'SOURCE_BOOTSTRAP=FAIL missing_github_token'}
          $pair="x-access-token:$env:GITHUB_TOKEN";$basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair));$extra="AUTHORIZATION: basic $basic"
          # Explicit reset removes runner-inherited Authorization before our single scoped header.
          $authArgs=@('-c','http.extraHeader=','-c',"http.https://github.com/.extraheader=$extra",'-c','credential.helper=')
          & $git -C $workspace @authArgs fetch --force --no-tags origin $env:EXPECTED_SOURCE_SHA
          if($LASTEXITCODE -ne 0){throw 'SOURCE_BOOTSTRAP=FAIL component=RUNNER operation=authenticated_fetch'}
          & $git -C $workspace checkout --detach --force $env:EXPECTED_SOURCE_SHA
          if($LASTEXITCODE -ne 0){throw 'SOURCE_BOOTSTRAP=FAIL checkout'}
          & $git -C $workspace clean -fdx
          if($LASTEXITCODE -ne 0){throw 'SOURCE_BOOTSTRAP=FAIL clean'}
          $head=(& $git -C $workspace rev-parse HEAD).Trim()
          if($head -ne $env:EXPECTED_SOURCE_SHA){throw "SOURCE_BOOTSTRAP=FAIL expected=$env:EXPECTED_SOURCE_SHA actual=$head"}
          # Fail closed: all commits since the pristine main SHA may change ONLY this workflow.
          # Keep the shared GitHub concurrency/physical device locks unchanged.
          $ancestor=(& $git -C $workspace merge-base $env:BASELINE_MAIN_SHA $head).Trim()
          if($LASTEXITCODE -ne 0 -or $ancestor -ne $env:BASELINE_MAIN_SHA){throw "NORMAL_SOURCE=FAIL ancestor=$ancestor baseline=$env:BASELINE_MAIN_SHA"}
          $changed=@(& $git -C $workspace diff --name-only $env:BASELINE_MAIN_SHA $head)
          $allowed=@('.github/scripts/armyattack-build.ps1','.github/scripts/armyattack-workspace.ps1','.github/workflows/android-normal-apk.yml','Tools/CI/Ensure-PortableFileHash.ps1')
          $unexpected=@($changed|Where-Object{$_ -notin $allowed})
          if($unexpected.Count -ne 0 -or $changed.Count -ne $allowed.Count){
            throw "NORMAL_SOURCE=FAIL expected=workflow_and_hash_compat_only changed=$($changed -join ',') unexpected=$($unexpected -join ',')"
          }
          foreach($script in @('.github/scripts/armyattack-build.ps1','.github/scripts/armyattack-workspace.ps1')){
            $stats=@(& $git -C $workspace diff --numstat $env:BASELINE_MAIN_SHA $head -- $script)
            if($stats.Count -ne 1 -or $stats[0] -notmatch '^1\s+0\s+'){
              throw "NORMAL_SOURCE=FAIL script_has_non_compat_changes path=$script actual=$($stats -join ',')"
            }
            $headLines=@(Get-Content -LiteralPath (Join-Path $workspace $script))
            $importLines=@($headLines|Where-Object{$_ -match '^\.\s+\(Join-Path \$PSScriptRoot.*Ensure-PortableFileHash\.ps1'})
            if($importLines.Count -ne 1){
              throw "NORMAL_SOURCE=FAIL portable_helper_import_missing script=$script count=$($importLines.Count)"
            }
          }
          $hashHelperBlob=(& $git -C $workspace hash-object 'Tools/CI/Ensure-PortableFileHash.ps1').Trim()
          if($hashHelperBlob -ne '4b62007909ee95eb3c04e3b548d0601a2e8bb804'){
            throw "NORMAL_SOURCE=FAIL portable_helper_hash unexpected=$hashHelperBlob"
          }
          Write-Host "SOURCE_BOOTSTRAP=PASS sha=$head"
          Write-Host "NORMAL_GAME_SOURCE=PASS identical_to_main=$($env:BASELINE_MAIN_SHA) permitted_changes=workflow,portable_hash_only"
          Write-Host 'NORMAL_PORTABLE_HELPER_INTEGRITY=PASS scripts=2 blob=4b62007909ee95eb3c04e3b548d0601a2e8bb804'

      - name: Validate Army Core hooks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @('.\.github\scripts\armyattack-project-precheck.ps1','.\.github\scripts\armyattack-workspace.ps1','.\.github\scripts\armyattack-build.ps1','.\.github\scripts\publish-armyattack-project-source.ps1','.\Tools\CI\Precheck-GitIndexLock.ps1','.\Tools\CI\Build-Android.ps1','.\Tools\CI\Validate-AndroidApk.ps1','.\Tools\CI\Patch-AndroidPerformanceSwf.ps1','.\Tools\SWF\Ensure-FFDec.ps1','.\Tools\CI\Ensure-HarmanAir502.ps1','.\Tools\CI\Ensure-PortableJdk17.ps1','.\Tools\CI\Ensure-PinnedAndroidSdkRoot.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors)
            if(@($errors).Count -gt 0){$errors|ForEach-Object{Write-Host "PARSER_ERROR file=$script line=$($_.Extent.StartLineNumber) message=$($_.Message)"};throw "PARSER_VALID=FAIL file=$script"}
            Write-Host "PARSER_VALID=PASS file=$script"
          }

      - name: Validate Army AndroidBuild project contract
        shell: powershell
        run: |
          & '.\.github\scripts\armyattack-project-precheck.ps1'

      - name: Regression test portable hash inside Windows PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:ARMY_TEST_PORTABLE_HASH='1'
          . '.\Tools\CI\Ensure-PortableFileHash.ps1'
          $temp=[IO.Path]::GetTempFileName()
          try {
            [IO.File]::WriteAllBytes($temp,[Text.Encoding]::ASCII.GetBytes('abc'))
            $actual=(Get-FileHash -LiteralPath $temp -Algorithm SHA256).Hash.ToLowerInvariant()
            if($actual -ne 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad'){throw "PORTABLE_HASH_TEST=FAIL actual=$actual"}
            Write-Host 'PORTABLE_HASH_TEST=PASS algorithm=SHA256 known_vector=abc provider=dotnet'
          }finally{
            Remove-Item -LiteralPath $temp -Force -ErrorAction SilentlyContinue
            Remove-Item Env:ARMY_TEST_PORTABLE_HASH -ErrorAction SilentlyContinue
          }

      - name: Build validate and publish Army candidate through Core 3.0.11+
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          # The self-hosted Windows PowerShell profile can lack Microsoft.PowerShell.Utility/Get-FileHash.
          # Use .NET SHA256 directly for independent post-build and copied-file integrity checks.
          function Get-NormalApkSha256 {
            param([Parameter(Mandatory=$true)][string]$LiteralPath)
            if(-not(Test-Path -LiteralPath $LiteralPath -PathType Leaf)){throw "NORMAL_HASH=FAIL file_missing=$LiteralPath"}
            $stream=[IO.File]::OpenRead($LiteralPath)
            $hasher=[System.Security.Cryptography.SHA256]::Create()
            try {
              return ([BitConverter]::ToString($hasher.ComputeHash($stream))).Replace('-','').ToUpperInvariant()
            }finally{
              if($hasher){$hasher.Dispose()}
              if($stream){$stream.Dispose()}
            }
          }
          Write-Host 'NORMAL_PORTABLE_HASH=PASS provider=System.Security.Cryptography.SHA256'
          $checkout=$PWD.Path
          Import-Module (Join-Path $env:ANDROIDBUILD_ROOT 'Core\Current\AndroidBuild.psd1') -DisableNameChecking -Force
          $git=Get-AndroidBuildGitPath $env:ANDROIDBUILD_ROOT
          $checkoutSha=(& $git -C $checkout rev-parse HEAD).Trim()
          if($checkoutSha -ne $env:EXPECTED_SOURCE_SHA){throw "STALE_TEST_RESULT checkout=$checkoutSha expected=$env:EXPECTED_SOURCE_SHA"}
          $persistent=Join-Path $env:ANDROIDBUILD_ROOT 'Repositories\code-army-client'
          & '.\Tools\CI\Precheck-GitIndexLock.ps1' -RepoRoot $persistent
          $pr=if([string]::IsNullOrWhiteSpace($env:PR_NUMBER)){0}else{[int]$env:PR_NUMBER}
          $projectConfig=Get-Content -LiteralPath (Join-Path $checkout '.androidbuild.json') -Raw|ConvertFrom-Json
          $leaseWait=[int]$projectConfig.timeouts.build_lease_wait_seconds
          if($leaseWait -lt 30 -or $leaseWait -gt 600){throw "BUILD_LEASE_WAIT=FAIL seconds=$leaseWait allowed=30..600"}
          Write-Host "BUILD_LEASE_WAIT=PASS seconds=$leaseWait serialization=army-attack-core-build"
          $result=Invoke-AndroidBuildCandidateValidation -RepoRoot $persistent -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA -Repository $env:GITHUB_REPOSITORY -PrNumber $pr -SourceRemote $checkout -PackageName 'air.army.attack' -LeaseWaitSeconds $leaseWait

          $pair="x-access-token:$env:GITHUB_TOKEN";$basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair));$extra="AUTHORIZATION: basic $basic"
          $authArgs=@('-c','http.extraHeader=','-c',"http.https://github.com/.extraheader=$extra",'-c','credential.helper=')
          $probeArgs=@('-C',$checkout)+$authArgs+@('ls-remote','origin',("refs/heads/"+$env:SOURCE_BRANCH))
          $probe=Invoke-AndroidBuildProcess -FilePath $git -ArgumentList $probeArgs -WorkingDirectory $checkout -TimeoutSeconds 30 -Environment @{GIT_TERMINAL_PROMPT='0';GCM_INTERACTIVE='Never'} -AllowNonZeroExit
          $line=([string]$probe.stdout).Trim()
          if($probe.exit_code -ne 0 -or [string]::IsNullOrWhiteSpace($line)){throw "APK_CANDIDATE_HEAD_RECHECK=FAIL exit=$($probe.exit_code)"}
          $remote=(($line -split '\s+')[0]).Trim()
          if($remote -ne $env:EXPECTED_SOURCE_SHA){throw "STALE_TEST_RESULT remote_head=$remote expected=$env:EXPECTED_SOURCE_SHA"}

          $metaPath=Join-Path $persistent '.work\artifacts\android\armyattack-build.json'
          if(-not(Test-Path -LiteralPath $metaPath)){throw "CORE_CANDIDATE=FAIL metadata_missing=$metaPath"}
          $meta=Get-Content -LiteralPath $metaPath -Raw|ConvertFrom-Json
          if([string]$meta.source_sha -ne $env:EXPECTED_SOURCE_SHA){throw 'CORE_CANDIDATE=FAIL metadata_sha'}
          $hookCore=[version]([string]$meta.core_version)
          if($hookCore -lt [version]'3.0.11'){throw "CORE_CANDIDATE=FAIL hook_core=$hookCore minimum=3.0.11"}
          $provenanceCore=[version]([string]$result.build.provenance.core_version)
          if($hookCore -ne $provenanceCore){throw "CORE_CANDIDATE=FAIL core_provenance_mismatch hook=$hookCore provenance=$provenanceCore"}
          if([string]$meta.toolchain_ownership -ne 'androidbuild-global'){throw "CORE_CANDIDATE=FAIL toolchain_ownership=$($meta.toolchain_ownership)"}
          if([string]$meta.workspace.build_root -notlike (Join-Path $persistent '.work\build*')){throw "CORE_CANDIDATE=FAIL workspace_build_root=$($meta.workspace.build_root)"}
          if([int]$meta.workspace.retention_generations -ne 3){throw "CORE_CANDIDATE=FAIL workspace_retention=$($meta.workspace.retention_generations)"}
          $apk=[string]$result.apk_path;$hash=(Get-NormalApkSha256 -LiteralPath $apk)
          if($hash -ne ([string]$result.apk.identity.sha256).ToUpperInvariant()){throw 'CORE_CANDIDATE=FAIL apk_hash'}
          if($null -eq $result.final_apk){throw 'APK_FINAL_PUBLICATION=FAIL result_missing'}
          $finalPath=[string]$result.final_apk.path
          $finalSha=([string]$result.final_apk.sha256).ToUpperInvariant()
          if(-not(Test-Path -LiteralPath $finalPath -PathType Leaf)){throw "APK_FINAL_PUBLICATION=FAIL file_missing path=$finalPath"}
          $diskFinalSha=(Get-NormalApkSha256 -LiteralPath $finalPath)
          if($finalSha -ne $hash -or $diskFinalSha -ne $hash){throw "APK_FINAL_PUBLICATION=FAIL hash candidate=$hash result=$finalSha disk=$diskFinalSha"}
          if([IO.Path]::GetFileName($finalPath) -ne [string]$projectConfig.delivery.final_apk_name){throw "APK_FINAL_PUBLICATION=FAIL ownership expected=$($projectConfig.delivery.final_apk_name) actual=$([IO.Path]::GetFileName($finalPath))"}
          Write-Host "CORE_BUILD_PROVENANCE=PASS core=$provenanceCore minimum=3.0.11"
          Write-Host "ARMY_FLASH_TOOLCHAIN_OWNERSHIP=$($meta.toolchain_ownership)"
          Write-Host "ARMY_WORKSPACE_OWNERSHIP=PASS build=$($meta.workspace.build_root) cache=$($meta.workspace.input_cache_root) scratch=$($meta.workspace.scratch_root) retention=$($meta.workspace.retention_generations)"
          Write-Host "ARMY_AIR_VERSION=$($meta.air_version)"
          Write-Host "ARMY_FFDEC_VERSION=$($meta.ffdec_version)"
          Write-Host "APK_PACKAGE=$($result.apk.identity.package_name)"
          Write-Host "APK_SIZE=$($result.apk.identity.bytes)"
          Write-Host "APK_SHA256=$hash"
          Write-Host "APK_CANDIDATE_REMOTE_HEAD=$remote"
          Write-Host 'APK_CANDIDATE_HEAD_RECHECK=PASS'
          Write-Host "APK_FINAL_PUBLICATION=PASS path=$finalPath sha256=$diskFinalSha validation_scope=candidate"
          # Keep a separate hash-verified NORMAL copy. The rolling filename might
          # still contain a candidate from the cancelled feature branch.
          $normalPath=Join-Path (Join-Path $env:ANDROIDBUILD_ROOT 'APK-FINAL') 'ArmyAttack-23.2-NORMAL-main-2d10485e.apk'
          Copy-Item -LiteralPath $finalPath -Destination $normalPath -Force
          $normalHash=(Get-NormalApkSha256 -LiteralPath $normalPath)
          if($normalHash -ne $hash){throw "NORMAL_APK=FAIL expected=$hash actual=$normalHash"}
          $normalManifest=[ordered]@{
            schema='armyattack-normal-apk/v1'
            repository=$env:GITHUB_REPOSITORY
            game_source_sha=$env:BASELINE_MAIN_SHA
            workflow_only_sha=$env:EXPECTED_SOURCE_SHA
            run_id=$env:GITHUB_RUN_ID
            runner=$env:RUNNER_NAME
            package_name=[string]$result.apk.identity.package_name
            apk_path=$normalPath
            apk_bytes=[int64]$result.apk.identity.bytes
            apk_sha256=$normalHash
            validation='CANDIDATE_ONLY'
            physical_validation='NOT_EXECUTED'
          }
          $manifestPath=[IO.Path]::ChangeExtension($normalPath,'.json')
          $normalManifest|ConvertTo-Json -Depth 5|Set-Content -LiteralPath $manifestPath -Encoding UTF8
          Write-Host "NORMAL_APK=PASS path=$normalPath sha256=$normalHash main_source=$env:BASELINE_MAIN_SHA manifest=$manifestPath"
          Write-Host 'CANDIDATE_VALIDATION=PASS'
          Write-Host 'PHYSICAL_VALIDATION=NOT_ACTIVATED'
          Write-Host 'MANUAL_PHYSICAL_PROFILE=Recording starts automatically; PERF only opens or closes the metrics panel'
          Write-Host 'MANUAL_PHYSICAL_ZIP=Press ZIP to share a snapshot without stopping the recording'
          Write-Host 'FINAL_VALIDATION=VALIDATION_INCOMPLETE physical_validation_required'

      - name: Keep physical validation explicit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          Write-Host "PHYSICAL_DISPATCH=SKIPPED_WITH_REASON explicit_user_authorization_required tested_sha=$env:EXPECTED_SOURCE_SHA branch=$env:SOURCE_BRANCH workflow=android-physical.yml"
          Write-Host 'PHYSICAL_VALIDATION=NOT_ACTIVATED'
