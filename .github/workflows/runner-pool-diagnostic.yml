name: Diagnose Windows runner pool

on:
  push:
    branches:
      - chore/local-army-bootstrap-20260827
    paths:
      - .github/workflows/runner-pool-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect local runner registrations
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Inspect runner services safely
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "DIAGNOSTIC_RUNNER=$env:RUNNER_NAME"
          Write-Host "COMPUTER=$env:COMPUTERNAME"

          $services=@(Get-CimInstance Win32_Service | Where-Object {
            $_.Name -like 'actions.runner*' -or $_.DisplayName -like '*Actions Runner*'
          } | Sort-Object Name)

          Write-Host "RUNNER_SERVICE_COUNT=$($services.Count)"
          foreach($svc in $services){
            Write-Host "SERVICE_BEGIN"
            Write-Host "SERVICE_NAME=$($svc.Name)"
            Write-Host "SERVICE_STATE=$($svc.State)"
            Write-Host "SERVICE_STARTMODE=$($svc.StartMode)"
            Write-Host "SERVICE_STARTNAME=$($svc.StartName)"

            $path=[string]$svc.PathName
            $exe=''
            if($path -match '^"([^"]+)"'){$exe=$matches[1]}
            elseif($path -match '^(\S+\.exe)'){$exe=$matches[1]}
            Write-Host "SERVICE_EXE=$exe"

            if($exe -and (Test-Path -LiteralPath $exe)){
              $root=Split-Path -Parent (Split-Path -Parent $exe)
              Write-Host "RUNNER_ROOT=$root"
              $runnerFile=Join-Path $root '.runner'
              if(Test-Path -LiteralPath $runnerFile){
                try{
                  $r=Get-Content -LiteralPath $runnerFile -Raw | ConvertFrom-Json
                  Write-Host "AGENT_NAME=$($r.agentName)"
                  Write-Host "POOL_ID=$($r.poolId)"
                  Write-Host "POOL_NAME=$($r.poolName)"
                  Write-Host "SERVER_URL=$($r.serverUrl)"
                  Write-Host "GITHUB_URL=$($r.gitHubUrl)"
                  Write-Host "WORK_FOLDER=$($r.workFolder)"
                  Write-Host "USE_V2_FLOW=$($r.useV2Flow)"
                }catch{
                  Write-Host "RUNNER_METADATA=UNREADABLE"
                }
              }else{
                Write-Host "RUNNER_METADATA=MISSING"
              }
            }
            Write-Host "SERVICE_END"
          }

          $listeners=@(Get-Process -Name 'Runner.Listener' -ErrorAction SilentlyContinue)
          $workers=@(Get-Process -Name 'Runner.Worker' -ErrorAction SilentlyContinue)
          Write-Host "RUNNER_LISTENER_PROCESSES=$($listeners.Count)"
          Write-Host "RUNNER_WORKER_PROCESSES=$($workers.Count)"

          foreach($p in $listeners | Sort-Object Id){
            Write-Host "LISTENER_BEGIN"
            Write-Host "LISTENER_PID=$($p.Id)"
            $exe=$null
            try{$exe=$p.Path}catch{}
            Write-Host "LISTENER_EXE=$exe"
            if($exe -and (Test-Path -LiteralPath $exe)){
              $root=Split-Path -Parent (Split-Path -Parent $exe)
              Write-Host "LISTENER_ROOT=$root"
              $runnerFile=Join-Path $root '.runner'
              if(Test-Path -LiteralPath $runnerFile){
                try{
                  $r=Get-Content -LiteralPath $runnerFile -Raw | ConvertFrom-Json
                  Write-Host "LISTENER_AGENT_NAME=$($r.agentName)"
                  Write-Host "LISTENER_POOL_ID=$($r.poolId)"
                  Write-Host "LISTENER_POOL_NAME=$($r.poolName)"
                  Write-Host "LISTENER_SERVER_URL=$($r.serverUrl)"
                  Write-Host "LISTENER_GITHUB_URL=$($r.gitHubUrl)"
                  Write-Host "LISTENER_WORK_FOLDER=$($r.workFolder)"
                  Write-Host "LISTENER_USE_V2_FLOW=$($r.useV2Flow)"
                }catch{
                  Write-Host "LISTENER_METADATA=UNREADABLE"
                }
              } else {
                Write-Host "LISTENER_METADATA=MISSING"
              }
            }
            Write-Host "LISTENER_END"
          }

          $rootCandidates=@()
          foreach($drive in Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue){
            if($drive.Root){
              $candidate=Join-Path $drive.Root 'AndroidBuild\PC-PROFILES\PC-WILLTHOM-services.json'
              if(Test-Path -LiteralPath $candidate){$rootCandidates+=$candidate}
            }
          }
          foreach($profile in $rootCandidates){
            Write-Host "PROFILE_PATH=$profile"
            try{
              $json=Get-Content -LiteralPath $profile -Raw | ConvertFrom-Json
              foreach($prop in $json.PSObject.Properties){
                $name=[string]$prop.Name
                if($name -match '(?i)token|secret|key|password|credential'){continue}
                $value=$prop.Value
                if($value -is [System.Collections.IDictionary] -or $value -is [pscustomobject] -or $value -is [System.Array]){
                  Write-Host "PROFILE_FIELD=$name TYPE=$($value.GetType().Name)"
                } else {
                  Write-Host "PROFILE_FIELD=$name VALUE=$value"
                }
              }
            }catch{
              Write-Host "PROFILE_READ=UNREADABLE"
            }
          }
