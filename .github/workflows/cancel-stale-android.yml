name: Cancel stale Android candidate runs

on:
  push:
    branches:
      - chore/local-army-bootstrap-20260827

permissions:
  actions: write
  contents: read

concurrency:
  group: army-attack-stale-run-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-stale:
    name: Cancel obsolete Android runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CURRENT_SHA: ${{ github.sha }}
      SOURCE_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Cancel stale candidate runs
        shell: bash
        run: |
          set -euo pipefail
          echo "STALE_RUN_CLEANUP=START repository=$REPOSITORY branch=$SOURCE_BRANCH current_sha=$CURRENT_SHA"

          runs_json="$(gh api --paginate "repos/$REPOSITORY/actions/workflows/android-candidate.yml/runs?branch=$SOURCE_BRANCH&per_page=100")"
          mapfile -t stale_ids < <(
            printf '%s' "$runs_json" |
              jq -r --arg sha "$CURRENT_SHA" '
                .workflow_runs[]
                | select(.head_sha != $sha)
                | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested")
                | .id
              ' |
              sort -u
          )

          if [ "${#stale_ids[@]}" -eq 0 ]; then
            echo "STALE_RUN_CLEANUP=PASS cancelled=0"
            exit 0
          fi

          failures=0
          for run_id in "${stale_ids[@]}"; do
            echo "STALE_RUN_CANCEL=ATTEMPT run=$run_id"
            if gh api --method POST "repos/$REPOSITORY/actions/runs/$run_id/cancel" >/dev/null; then
              echo "STALE_RUN_CANCEL=REQUESTED run=$run_id"
            else
              echo "STALE_RUN_CANCEL=REQUEST_FAILED run=$run_id"
            fi
          done

          sleep 3

          for run_id in "${stale_ids[@]}"; do
            status="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.status')"
            if [ "$status" != "completed" ]; then
              echo "STALE_RUN_FORCE_CANCEL=ATTEMPT run=$run_id status=$status"
              if gh api --method POST "repos/$REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null; then
                echo "STALE_RUN_FORCE_CANCEL=REQUESTED run=$run_id"
              else
                echo "STALE_RUN_FORCE_CANCEL=FAIL run=$run_id"
                failures=$((failures+1))
              fi
            else
              echo "STALE_RUN_CANCEL=PASS run=$run_id"
            fi
          done

          sleep 3

          for run_id in "${stale_ids[@]}"; do
            status="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.status')"
            conclusion="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.conclusion // ""')"
            if [ "$status" = "completed" ]; then
              echo "STALE_RUN_FINAL=PASS run=$run_id conclusion=$conclusion"
            else
              echo "STALE_RUN_FINAL=FAIL run=$run_id status=$status"
              failures=$((failures+1))
            fi
          done

          if [ "$failures" -ne 0 ]; then
            echo "STALE_RUN_CLEANUP=FAIL failures=$failures"
            exit 1
          fi
          echo "STALE_RUN_CLEANUP=PASS cancelled=${#stale_ids[@]}"
