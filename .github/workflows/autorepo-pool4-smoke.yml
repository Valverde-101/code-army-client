name: AutoRepo Pool4 Smoke

on:
  push:
    branches:
      - infra/autorepo-pool4-smoke

permissions:
  contents: read

jobs:
  slot-a:
    name: Pool smoke A
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    steps:
      - name: Hold A
        shell: powershell
        run: |
          Write-Host "SMOKE_JOB=A RUNNER_NAME=$env:RUNNER_NAME START=$(Get-Date -Format o)"
          Start-Sleep -Seconds 20
          Write-Host "SMOKE_JOB=A RUNNER_NAME=$env:RUNNER_NAME END=$(Get-Date -Format o)"

  slot-b:
    name: Pool smoke B
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
