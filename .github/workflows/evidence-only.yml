name: Army Attack evidence-only

on:
  push:
    paths:
      - 'Logs/**'

permissions:
  contents: read

jobs:
  evidence-only:
    name: EVIDENCE_ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate logs-only commit and evidence policy
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          mapfile -d '' -t changed < <(git -c core.quotepath=false diff --name-only -z "$parent" HEAD)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "EVIDENCE_ONLY=FAIL no_changes"
            exit 1
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              Logs/physical-adb/*) ;;
              *) echo "EVIDENCE_ONLY=FAIL non_evidence_path=$path"; exit 1 ;;
            esac
          done

          if grep -RIE --exclude='manifest.json' -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}' Logs/physical-adb; then
            echo "SANITIZATION=FAIL secret_marker"
            exit 1
          fi

          python - <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path('Logs/physical-adb')
          runs=[]
          for cls in ('validations','failures'):
              c=root/cls
              if not c.exists():
                  continue
              for sha_dir in c.iterdir():
                  if not sha_dir.is_dir():
                      continue
                  for run in sha_dir.iterdir():
                      if run.is_dir():
                          runs.append(run)
          if len(runs)>3:
              raise SystemExit(f'EVIDENCE_RETENTION=FAIL runs={len(runs)} maximum=3')
          for run in runs:
              files=[p for p in run.rglob('*') if p.is_file()]
              if len(files)>200:
                  raise SystemExit(f'EVIDENCE_POLICY=FAIL run={run} files={len(files)} maximum=200')
              total=sum(p.stat().st_size for p in files)
              if total>26214400:
                  raise SystemExit(f'EVIDENCE_POLICY=FAIL run={run} bytes={total} maximum=26214400')
              screenshots=0
              for p in files:
                  size=p.stat().st_size
                  if size>8388608:
                      raise SystemExit(f'EVIDENCE_POLICY=FAIL file={p} bytes={size} maximum=8388608')
                  if p.suffix.lower() in {'.png','.jpg','.jpeg','.webp'}:
                      screenshots+=1
              if screenshots>8:
                  raise SystemExit(f'EVIDENCE_POLICY=FAIL run={run} screenshots={screenshots} maximum=8')
              manifest=run/'manifest.json'
              if not manifest.is_file():
                  raise SystemExit(f'EVIDENCE_MANIFEST=FAIL missing={manifest}')
              data=json.loads(manifest.read_text(encoding='utf-8-sig'))
              if data.get('schema')!='androidbuild-evidence/v1':
                  raise SystemExit(f'EVIDENCE_MANIFEST=FAIL schema={data.get("schema")} run={run}')
              listed=data.get('files') or []
              listed_paths=set()
              for item in listed:
                  rel=item.get('path','')
                  target=(run/rel).resolve()
                  try:
                      target.relative_to(run.resolve())
                  except ValueError:
                      raise SystemExit(f'EVIDENCE_MANIFEST=FAIL unsafe_path={rel}')
                  if not target.is_file():
                      raise SystemExit(f'EVIDENCE_MANIFEST=FAIL file_missing={rel}')
                  raw=target.read_bytes()
                  if len(raw)!=int(item.get('bytes',-1)):
                      raise SystemExit(f'EVIDENCE_MANIFEST=FAIL size={rel}')
                  digest=hashlib.sha256(raw).hexdigest().lower()
                  if digest!=str(item.get('sha256','')).lower():
                      raise SystemExit(f'EVIDENCE_MANIFEST=FAIL sha256={rel}')
                  if item.get('sanitized') is not True:
                      raise SystemExit(f'EVIDENCE_MANIFEST=FAIL sanitized={rel}')
                  listed_paths.add(rel.replace('\\','/'))
              actual={p.relative_to(run).as_posix() for p in files if p.name!='manifest.json'}
              if listed_paths!=actual:
                  raise SystemExit(f'EVIDENCE_MANIFEST=FAIL inventory_mismatch run={run}')
          print(f'EVIDENCE_POLICY=PASS runs={len(runs)} max_files=200 max_bytes=26214400 max_file_bytes=8388608 max_screenshots=8')
          print('EVIDENCE_MANIFEST=PASS')
          PY

          echo "SANITIZATION=PASS"
          echo "EVIDENCE_ONLY=PASS parent_sha=$parent commit=${{ github.sha }}"
