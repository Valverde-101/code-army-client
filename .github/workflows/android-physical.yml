name: Army Attack Android physical validation

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact source SHA whose validated APK must be tested
        required: false
        type: string
      source_branch:
        description: Feature branch that owns the tested SHA and evidence
        required: false
        type: string
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]
    paths-ignore:
      - 'Logs/**'
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'test/**'
      - 'chore/**'
    paths-ignore:
      - 'Logs/**'

permissions:
  contents: write
  pull-requests: read
  statuses: write

concurrency:
  group: army-attack-physical-${{ inputs.source_branch || github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
  SOURCE_BRANCH: ${{ inputs.source_branch || github.head_ref || github.ref_name }}

jobs:
  physical-adb:
    name: 5. Physical ADB validation
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 40
    steps:
      - name: Bootstrap portable Git
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@()
          $g=Get-Command git.exe -ErrorAction SilentlyContinue
          if($g){$candidates+=$g.Source}
          foreach($drive in Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue){
            if($drive.Root){
              $candidates+=@(
                (Join-Path $drive.Root 'AndroidBuild\Tools\Git\cmd\git.exe'),
                (Join-Path $drive.Root 'AndroidBuild\PortableGit\cmd\git.exe')
              )
            }
          }
          $git=$candidates|Where-Object{$_ -and (Test-Path -LiteralPath $_)}|Select-Object -First 1
          if(-not $git){throw 'PRECHECK_GIT=FAIL component=TOOLCHAIN operation=resolve_portable_git expected=AndroidBuild portable Git actual=missing'}
          (Split-Path -Parent $git)|Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH="$(Split-Path -Parent $git);$env:PATH"
          Write-Host "PRECHECK_GIT=PASS path=$git"

      - name: Checkout exact HEAD with evidence-push credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 2
          persist-credentials: true

      - name: Validate exact checkout, Core and portable ADB
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:SOURCE_BRANCH -eq 'main'){
            throw 'PHYSICAL_PRECHECK=FAIL same_pr_evidence_requires_feature_branch'
          }
          & '.\Tools\CI\Precheck-AndroidPhysical.ps1' -ExpectedSha $env:EXPECTED_SOURCE_SHA
          if($LASTEXITCODE -ne 0){throw "PHYSICAL_PRECHECK=FAIL exit=$LASTEXITCODE"}
          Import-Module (Join-Path $env:ANDROIDBUILD_ROOT 'Core\Current\AndroidBuild.psd1') -DisableNameChecking -Force
          $core=[version](Get-AndroidBuildCoreVersion)
          if($core -lt [version]'3.0.9'){throw "PHYSICAL_PRECHECK=FAIL core=$core minimum=3.0.9"}
          foreach($name in @('Initialize-AndroidBuildProjectWork','Reduce-AndroidBuildEvidence','Publish-AndroidBuildEvidence','Publish-AndroidBuildEvidenceCommit')){
            if(-not(Get-Command $name -ErrorAction SilentlyContinue)){throw "PHYSICAL_PRECHECK=FAIL core_evidence_capability=$name"}
          }
          Write-Host "PHYSICAL_CORE_PRECHECK=PASS core=$core evidence_publisher=androidbuild-global branch=$env:SOURCE_BRANCH tested_sha=$env:EXPECTED_SOURCE_SHA"

      - name: Prepare isolated raw evidence staging
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          Import-Module (Join-Path $env:ANDROIDBUILD_ROOT 'Core\Current\AndroidBuild.psd1') -DisableNameChecking -Force
          $work=Initialize-AndroidBuildProjectWork -RepoRoot $PWD.Path
          $raw=Join-Path $PWD.Path (".work\evidence-staging\"+$env:EXPECTED_SOURCE_SHA+"\"+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $raw){Remove-Item -LiteralPath $raw -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $raw|Out-Null
          "PHYSICAL_RAW_EVIDENCE=$raw"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $sentinel=Join-Path $PWD.Path '.work\.androidbuild-work-root'
          if(-not(Test-Path -LiteralPath $sentinel -PathType Leaf)){throw "WORK_ISOLATION=FAIL sentinel_missing_after_initialize expected=$sentinel"}
          Write-Host "WORK_ISOLATION=PASS work_root=$($work.work_root) sentinel=$sentinel"
          Write-Host "EVIDENCE_STAGING=PASS raw=$raw ownership=repo-work no_legacy_junction=true"

      - name: Resolve exact validated APK
        id: apk_wait
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          $repo=Join-Path $env:ANDROIDBUILD_ROOT 'Repositories\code-army-client'
          $runtime=Join-Path $repo '.work\runtime\AndroidBuild'
          $deadline=(Get-Date).AddMinutes(3)
          $apk=$null
          do {
            $candidate=Join-Path $runtime "Builds\code-army-client\$env:EXPECTED_SOURCE_SHA\android\candidate\ArmyAttack-23.2-$env:EXPECTED_SOURCE_SHA.apk"
            if(Test-Path -LiteralPath $candidate){$apk=Get-Item -LiteralPath $candidate;break}
            Start-Sleep -Seconds 5
          } while((Get-Date) -lt $deadline)
          if(-not $apk){throw "APK_VALIDATE=FAIL component=APK operation=resolve_exact_candidate_after_candidate_pass expected_sha=$env:EXPECTED_SOURCE_SHA actual=not_found timeout_minutes=3 runtime=$runtime"}
          $sha=(Get-FileHash -LiteralPath $apk.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "ANDROID_APK_PATH=$($apk.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_APK_SHA256=$sha"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "APK_EXACT=PASS tested_sha=$env:EXPECTED_SOURCE_SHA path=$($apk.FullName) size=$($apk.Length) sha256=$sha source=repo-work dispatch=candidate_success"

      - name: Test exact APK on physical device
        id: device_test
        if: steps.apk_wait.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & '.\Tools\CI\Test-AndroidDevice.ps1' -ApkPath $env:ANDROID_APK_PATH -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA -EvidenceRoot $env:PHYSICAL_RAW_EVIDENCE
          if($LASTEXITCODE -ne 0){throw "PHYSICAL_VALIDATION=FAIL exit=$LASTEXITCODE"}

      - name: Validate always-on runtime and SWF traces
        id: runtime_diag
        if: always() && steps.device_test.outcome == 'success'
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ANDROID_APK_SHA256){throw 'RUNTIME_DIAGNOSTICS=FAIL apk_sha_missing'}
          & '.\Tools\CI\Analyze-AndroidRuntimeDiagnostics.ps1' -EvidenceRoot $env:PHYSICAL_RAW_EVIDENCE -ExpectedSha $env:EXPECTED_SOURCE_SHA -ExpectedApkSha256 $env:ANDROID_APK_SHA256
          if($LASTEXITCODE -ne 0){throw "RUNTIME_DIAGNOSTICS=FAIL exit=$LASTEXITCODE"}

      - name: Resolve physical validation truth
        id: truth
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          $apkOutcome='${{ steps.apk_wait.outcome }}'
          $deviceOutcome='${{ steps.device_test.outcome }}'
          $diagOutcome='${{ steps.runtime_diag.outcome }}'
          $result='FAIL';$classification='FAIL';$reason='upstream_gate_failed'
          $raw=$env:PHYSICAL_RAW_EVIDENCE
          if([string]::IsNullOrWhiteSpace($raw)){
            $raw=Join-Path $PWD.Path (".work\evidence-staging\"+$env:EXPECTED_SOURCE_SHA+"\"+$env:GITHUB_RUN_ID)
            New-Item -ItemType Directory -Force -Path $raw|Out-Null
            "PHYSICAL_RAW_EVIDENCE=$raw"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }
          $summaryPath=Join-Path $raw 'summary.json'
          $summary=$null
          if(Test-Path -LiteralPath $summaryPath){try{$summary=Get-Content -LiteralPath $summaryPath -Raw|ConvertFrom-Json}catch{}}
          if($apkOutcome -ne 'success'){$reason='candidate_apk_unavailable'}
          elseif($deviceOutcome -ne 'success'){$reason='device_test_failed'}
          elseif(-not $summary){$reason='physical_summary_missing'}
          elseif([string]$summary.result -eq 'SKIPPED_WITH_REASON'){$classification='SKIPPED_WITH_REASON';$reason='physical_test_skipped_'+[string]$summary.reason}
          elseif($diagOutcome -ne 'success'){$reason='runtime_diagnostics_failed'}
          else{
            $required=@('ADB_DEVICE','DEVICE_LOCK','INSTALL','START','BOOT_READY','HEALTH','SMOKE','FUNCTIONAL_TESTS','CRASH_CHECK','ANR_CHECK','PHYSICAL_EVIDENCE')
            $bad=@()
            foreach($gate in $required){$value=[string]$summary.results.$gate;if($value -ne 'PASS'){$bad+="$gate=$value"}}
            if($bad.Count -eq 0){$result='PASS';$classification='PASS';$reason='all_mandatory_physical_gates_pass'}else{$reason='mandatory_gate_'+($bad -join ',')}
          }
          [ordered]@{repository=$env:GITHUB_REPOSITORY;tested_sha=$env:EXPECTED_SOURCE_SHA;run_id=$env:GITHUB_RUN_ID;runner=$env:RUNNER_NAME;apk_outcome=$apkOutcome;device_outcome=$deviceOutcome;diagnostics_outcome=$diagOutcome;physical_result=$result;classification=$classification;reason=$reason;generated_utc=[DateTime]::UtcNow.ToString('o')}|ConvertTo-Json -Depth 6|Set-Content -LiteralPath (Join-Path $raw 'physical-gate.json') -Encoding UTF8
          "PHYSICAL_RESULT=$result"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PHYSICAL_CLASSIFICATION=$classification"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PHYSICAL_REASON=$reason"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "result=$result"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "classification=$classification"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "reason=$reason"|Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "PHYSICAL_TRUTH=$result classification=$classification reason=$reason tested_sha=$env:EXPECTED_SOURCE_SHA"

      - name: Publish sanitized bounded evidence through Core
        id: evidence_publish
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          $raw=$env:PHYSICAL_RAW_EVIDENCE
          if([string]::IsNullOrWhiteSpace($raw)){
            $raw=Join-Path $PWD.Path (".work\evidence-staging\"+$env:EXPECTED_SOURCE_SHA+"\"+$env:GITHUB_RUN_ID)
            New-Item -ItemType Directory -Force -Path $raw|Out-Null
          }
          if(-not(Test-Path -LiteralPath $raw -PathType Container)){throw "EVIDENCE_PUBLISH=FAIL raw_missing=$raw"}
          Import-Module (Join-Path $env:ANDROIDBUILD_ROOT 'Core\Current\AndroidBuild.psd1') -DisableNameChecking -Force
          $cfg=Get-Content -LiteralPath '.\.androidbuild.json' -Raw|ConvertFrom-Json
          Reduce-AndroidBuildEvidence -Path $raw|Out-Null
          $r=Publish-AndroidBuildEvidence -RepoRoot $PWD.Path -RawEvidencePath $raw -Result $env:PHYSICAL_RESULT -TestedSha $env:EXPECTED_SOURCE_SHA -KeepRuns ([int]$cfg.evidence.keep_runs_global) -MaxFiles ([int]$cfg.evidence.max_files_per_run) -MaxBytes ([int64]$cfg.evidence.max_total_bytes_per_run) -MaxFileBytes ([int64]$cfg.evidence.max_file_bytes) -MaxScreenshots ([int]$cfg.evidence.max_screenshots)
          if([string]$r.status -ne 'PASS'){throw "EVIDENCE_PUBLISH=FAIL status=$($r.status)"}
          "EVIDENCE_PUBLISHED_PATH=$($r.path)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "EVIDENCE_PUBLISH=PASS path=$($r.path) result=$($r.result) tested_sha=$($r.tested_sha) policy=core"

      - name: Commit evidence to the tested PR branch
        id: evidence_commit
        if: always() && steps.evidence_publish.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          Import-Module (Join-Path $env:ANDROIDBUILD_ROOT 'Core\Current\AndroidBuild.psd1') -DisableNameChecking -Force
          $r=Publish-AndroidBuildEvidenceCommit -RepoRoot $PWD.Path -Branch $env:SOURCE_BRANCH -TestedSha $env:EXPECTED_SOURCE_SHA -AndroidBuildRoot $env:ANDROIDBUILD_ROOT
          if([string]$r.status -notin @('PASS','NO_CHANGES')){throw "EVIDENCE_PUSH=FAIL status=$($r.status)"}
          $evidenceSha=[string]$r.evidence_commit_sha
          if($evidenceSha){"EVIDENCE_COMMIT_SHA=$evidenceSha"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append}
          Write-Host "TESTED_SHA=$env:EXPECTED_SOURCE_SHA"
          Write-Host "EVIDENCE_COMMIT_SHA=$(if($evidenceSha){$evidenceSha}else{'NO_CHANGES'})"
          Write-Host "EVIDENCE_PUSH=$($r.status)"

      - name: Publish EVIDENCE_ONLY status on evidence commit
        id: evidence_status
        if: always() && steps.evidence_commit.outcome == 'success' && env.EVIDENCE_COMMIT_SHA != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:EVIDENCE_COMMIT_SHA"
          $body=[ordered]@{state='success';context='EVIDENCE_ONLY';description='Sanitized bounded evidence committed; heavy build intentionally skipped'}|ConvertTo-Json -Depth 3
          Invoke-RestMethod -Headers $headers -Uri $uri -Method Post -Body $body -ContentType 'application/json'|Out-Null
          Write-Host "EVIDENCE_ONLY_STATUS=PASS sha=$env:EVIDENCE_COMMIT_SHA tested_sha=$env:EXPECTED_SOURCE_SHA"

      - name: Publish APK-FINAL after physical PASS
        id: final_apk
        if: steps.truth.outputs.result == 'PASS' && steps.evidence_publish.outcome == 'success' && steps.evidence_commit.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not $env:ANDROID_APK_PATH){throw 'APK_FINAL_COPY=FAIL candidate_path_missing'}
          $actual=(Get-FileHash -LiteralPath $env:ANDROID_APK_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne ([string]$env:ANDROID_APK_SHA256).ToLowerInvariant()){throw "APK_FINAL_COPY=FAIL candidate_hash expected=$env:ANDROID_APK_SHA256 actual=$actual"}
          $cfg=Get-Content -LiteralPath '.\.androidbuild.json' -Raw|ConvertFrom-Json
          $ownedName=[string]$cfg.delivery.final_apk_name
          if([string]::IsNullOrWhiteSpace($ownedName)){throw 'APK_FINAL_COPY=FAIL owned_name_missing'}
          & '.\Tools\CI\Publish-ApkFinal.ps1' -SourceApk $env:ANDROID_APK_PATH -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA -RelativePath $ownedName -Kind 'base-23.2' -PhysicalValidated
          Write-Host "APK_FINAL_OWNED_NAME=$ownedName"

      - name: Enforce terminal physical gate
        if: always()
        shell: powershell
        run: |
          $truth='${{ steps.truth.outputs.result }}';$classification='${{ steps.truth.outputs.classification }}';$publish='${{ steps.evidence_publish.outcome }}';$commit='${{ steps.evidence_commit.outcome }}';$status='${{ steps.evidence_status.outcome }}';$final='${{ steps.final_apk.outcome }}'
          Write-Host "PHYSICAL_TRUTH=$truth";Write-Host "PHYSICAL_CLASSIFICATION=$classification";Write-Host "EVIDENCE_PUBLISH_OUTCOME=$publish";Write-Host "EVIDENCE_COMMIT_OUTCOME=$commit";Write-Host "EVIDENCE_STATUS_OUTCOME=$status";Write-Host "APK_FINAL_OUTCOME=$final"
          if($publish -ne 'success'){throw "FINAL_VALIDATION=FAIL evidence_publish=$publish"}
          if($commit -ne 'success'){throw "FINAL_VALIDATION=FAIL evidence_commit=$commit"}
          if($env:EVIDENCE_COMMIT_SHA -and $status -ne 'success'){throw "FINAL_VALIDATION=FAIL evidence_only_status=$status"}
          if($classification -eq 'SKIPPED_WITH_REASON'){
            Write-Host "PHYSICAL_VALIDATION=SKIPPED_WITH_REASON reason=${{ steps.truth.outputs.reason }}"
            Write-Host "FINAL_VALIDATION=VALIDATION_INCOMPLETE physical_validation=SKIPPED_WITH_REASON reason=${{ steps.truth.outputs.reason }} evidence=PASS"
            exit 0
          }
          if($truth -ne 'PASS'){throw "PHYSICAL_VALIDATION=FAIL reason=${{ steps.truth.outputs.reason }}"}
          if($final -ne 'success'){throw "FINAL_VALIDATION=FAIL apk_final=$final"}
          Write-Host 'PHYSICAL_VALIDATION=PASS'
          Write-Host 'FINAL_VALIDATION=PASS physical_validation=PASS evidence=PASS apk_final=PASS'

      - name: Physical validation summary
        if: always()
        shell: powershell
        run: |
          Write-Host "REPOSITORY=$env:GITHUB_REPOSITORY"
          Write-Host "BRANCH=$env:SOURCE_BRANCH"
          Write-Host "TESTED_SHA=$env:EXPECTED_SOURCE_SHA"
          Write-Host "EVIDENCE_COMMIT_SHA=$(if($env:EVIDENCE_COMMIT_SHA){$env:EVIDENCE_COMMIT_SHA}else{'NOT_PUBLISHED'})"
          Write-Host "RUN=$env:GITHUB_RUN_ID"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "PHYSICAL_RESULT=$(if($env:PHYSICAL_RESULT){$env:PHYSICAL_RESULT}else{'NOT_RESOLVED'})"
          Write-Host "PHYSICAL_CLASSIFICATION=$(if($env:PHYSICAL_CLASSIFICATION){$env:PHYSICAL_CLASSIFICATION}else{'NOT_RESOLVED'})"
          Write-Host "PHYSICAL_REASON=$(if($env:PHYSICAL_REASON){$env:PHYSICAL_REASON}else{'NOT_RESOLVED'})"
          if($env:ANDROID_APK_PATH){Write-Host "APK_PATH=$env:ANDROID_APK_PATH"}
          if($env:ANDROID_APK_SHA256){Write-Host "APK_SHA256=$env:ANDROID_APK_SHA256"}
          if($env:EVIDENCE_PUBLISHED_PATH){Write-Host "PHYSICAL_EVIDENCE_ROOT=$env:EVIDENCE_PUBLISHED_PATH"}
