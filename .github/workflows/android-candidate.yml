name: Army Attack Android candidate

on:
  push:
    branches:
      - chore/local-army-bootstrap-20260827
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: army-attack-candidate-v5-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_SOURCE_SHA: ${{ github.sha }}
  SOURCE_BRANCH: ${{ github.ref_name }}

jobs:
  source-sync:
    name: 1. Sync exact HEAD
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 10
    steps:
      - name: Bootstrap portable Git
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidates=@()
          $g=Get-Command git.exe -ErrorAction SilentlyContinue
          if($g){$candidates+=$g.Source}
          foreach($drive in Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue){
            if($drive.Root){$candidates+=@((Join-Path $drive.Root 'AndroidBuild\Tools\Git\cmd\git.exe'),(Join-Path $drive.Root 'AndroidBuild\PortableGit\cmd\git.exe'))}
          }
          $git=$candidates|Where-Object{$_ -and (Test-Path -LiteralPath $_)}|Select-Object -First 1
          if(-not $git){throw 'PRECHECK_GIT=FAIL'}
          (Split-Path -Parent $git)|Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH="$(Split-Path -Parent $git);$env:PATH"
          Write-Host "PRECHECK_GIT=PASS path=$git"

      - name: Checkout exact workflow HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate exact checkout
        shell: powershell
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $env:EXPECTED_SOURCE_SHA){throw "EXACT_HEAD=FAIL expected=$env:EXPECTED_SOURCE_SHA actual=$actual"}
          Write-Host "EXACT_HEAD=PASS sha=$actual"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "RUN=$env:GITHUB_RUN_ID"

      - name: Synchronize canonical physical repository
        shell: powershell
        run: |
          & '.\Tools\CI\Bootstrap-PhysicalClone.ps1' -Repository $env:GITHUB_REPOSITORY -ExpectedSha $env:EXPECTED_SOURCE_SHA -SourceBranch $env:SOURCE_BRANCH

  published-audit:
    name: 2A. Audit v23.2 and mods
    needs: source-sync
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve physical root
        shell: powershell
        run: |
          $root=$null
          foreach($drive in Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue){
            if($drive.Root){$candidate=Join-Path $drive.Root 'AndroidBuild';if(Test-Path -LiteralPath (Join-Path $candidate 'Repositories\code-army-client')){$root=$candidate;break}}
          }
          if(-not $root){throw 'ANDROIDBUILD_ROOT=FAIL'}
          "ANDROIDBUILD_ROOT=$root"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PHYSICAL_REPO_ROOT=$(Join-Path $root 'Repositories\code-army-client')"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
      - name: Audit published v23.2 and mods
        shell: powershell
        run: |
          & '.\Tools\CI\Audit-PublishedContent.ps1' -RepoRoot $env:PHYSICAL_REPO_ROOT -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA

  toolchain-preflight:
    name: 2B. Provision HARMAN/JDK/SDK
    needs: source-sync
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve AndroidBuild root
        shell: powershell
        run: |
          $root=$null
          foreach($drive in Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue){
            if($drive.Root){$candidate=Join-Path $drive.Root 'AndroidBuild';if(Test-Path -LiteralPath (Join-Path $candidate 'Repositories\code-army-client')){$root=$candidate;break}}
          }
          if(-not $root){throw 'ANDROIDBUILD_ROOT=FAIL'}
          "ANDROIDBUILD_ROOT=$root"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
      - name: Prepare HARMAN AIR 50.2.3.6
        shell: powershell
        run: |
          & '.\Tools\CI\Ensure-HarmanAir502.ps1' -AndroidBuildRoot $env:ANDROIDBUILD_ROOT
      - name: Pin AIR50 Android SDK view
        shell: powershell
        run: |
          & '.\Tools\CI\Ensure-PinnedAndroidSdkRoot.ps1' -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -TargetApi '33' -BuildTools '33.0.2'

  reference-apk:
    name: 2C. Inspect upstream Android APK
    needs: source-sync
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve AndroidBuild root
        shell: powershell
        run: |
          $root=$null
          foreach($drive in Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue){
            if($drive.Root){$candidate=Join-Path $drive.Root 'AndroidBuild';if(Test-Path -LiteralPath (Join-Path $candidate 'Repositories\code-army-client')){$root=$candidate;break}}
          }
          if(-not $root){throw 'ANDROIDBUILD_ROOT=FAIL'}
          "ANDROIDBUILD_ROOT=$root"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
      - name: Inspect upstream Android reference
        shell: powershell
        run: |
          & '.\Tools\CI\Validate-UpstreamAndroidRelease.ps1' -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA

  windows-regression:
    name: 2D. Windows regression
    needs: source-sync
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve physical root
        shell: powershell
        run: |
          $root=$null
          foreach($drive in Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue){
            if($drive.Root){$candidate=Join-Path $drive.Root 'AndroidBuild';if(Test-Path -LiteralPath (Join-Path $candidate 'Repositories\code-army-client')){$root=$candidate;break}}
          }
          if(-not $root){throw 'ANDROIDBUILD_ROOT=FAIL'}
          "ANDROIDBUILD_ROOT=$root"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PHYSICAL_REPO_ROOT=$(Join-Path $root 'Repositories\code-army-client')"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
      - name: Validate exact-source upstream Windows reference
        id: upstream_reference
        shell: powershell
        run: |
          & '.\Tools\CI\Validate-UpstreamWindowsRelease.ps1' -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA
      - name: Diagnostic source-only recompilation
        id: source_rebuild
        continue-on-error: true
        shell: powershell
        run: |
          & '.\Tools\CI\Build-Windows.ps1' -RepoRoot $env:PHYSICAL_REPO_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA -AndroidBuildRoot $env:ANDROIDBUILD_ROOT
      - name: Assemble and validate full Windows candidate
        id: full_candidate
        shell: powershell
        run: |
          & '.\Tools\CI\Build-WindowsFullCandidate.ps1' -RepoRoot $env:PHYSICAL_REPO_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA -AndroidBuildRoot $env:ANDROIDBUILD_ROOT
      - name: Measure full candidate performance
        id: performance
        shell: powershell
        run: |
          & '.\Tools\CI\Measure-WindowsPerformance.ps1' -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA -DurationSeconds 20 -SampleSeconds 2
      - name: Windows gate
        if: always()
        shell: powershell
        run: |
          Write-Host "UPSTREAM_REFERENCE_OUTCOME=${{ steps.upstream_reference.outcome }}"
          Write-Host "FULL_CANDIDATE_OUTCOME=${{ steps.full_candidate.outcome }}"
          Write-Host "PERFORMANCE_OUTCOME=${{ steps.performance.outcome }}"
          if('${{ steps.upstream_reference.outcome }}' -ne 'success'){throw 'WINDOWS_REGRESSION=FAIL upstream_reference'}
          if('${{ steps.full_candidate.outcome }}' -ne 'success'){throw 'WINDOWS_REGRESSION=FAIL full_candidate'}
          if('${{ steps.performance.outcome }}' -ne 'success'){throw 'WINDOWS_REGRESSION=FAIL performance'}
          Write-Host "WINDOWS_REGRESSION=PASS"

  mod-variants:
    name: 3M. Android mod ${{ matrix.variant }}
    needs: [source-sync, published-audit, toolchain-preflight]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: [colossal, crimson, hardmode, none, swapped, swapped2, truecrimson]
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve physical and pinned roots
        shell: powershell
        run: |
          $root=$null
          foreach($drive in Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue){
            if($drive.Root){$candidate=Join-Path $drive.Root 'AndroidBuild';if(Test-Path -LiteralPath (Join-Path $candidate 'Repositories\code-army-client')){$root=$candidate;break}}
          }
          if(-not $root){throw 'ANDROIDBUILD_ROOT=FAIL'}
          $pinned=Join-Path $root 'Toolchains\AIR50-API33-BT33.0.2'
          foreach($p in @((Join-Path $root 'Tools\AIRSDK-50.2.3.6\bin\adt.bat'),(Join-Path $root 'Tools\Java\jdk-17\bin\java.exe'),(Join-Path $pinned 'AndroidSDK\build-tools\33.0.2\aapt.exe'))){if(-not (Test-Path -LiteralPath $p)){throw "MOD_TOOLCHAIN_PRECHECK=FAIL missing=$p"}}
          "ANDROIDBUILD_ROOT=$root"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PINNED_ANDROID_BUILD_ROOT=$pinned"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PHYSICAL_REPO_ROOT=$(Join-Path $root 'Repositories\code-army-client')"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "MOD_VARIANT=${{ matrix.variant }}"
      - name: Build and validate mod APK
        shell: powershell
        run: |
          & '.\Tools\CI\Build-AndroidModVariant.ps1' -RepoRoot $env:PHYSICAL_REPO_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA -PhysicalAndroidBuildRoot $env:ANDROIDBUILD_ROOT -PinnedAndroidBuildRoot $env:PINNED_ANDROID_BUILD_ROOT -Variant '${{ matrix.variant }}'
          Write-Host "GITHUB_ARTIFACT_UPLOAD=DISABLED"

  android-candidate:
    name: 3. Build and validate Android APK
    needs: [published-audit, toolchain-preflight, reference-apk]
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Resolve physical root
        shell: powershell
        run: |
          $root=$null
          foreach($drive in Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue){
            if($drive.Root){$candidate=Join-Path $drive.Root 'AndroidBuild';if(Test-Path -LiteralPath (Join-Path $candidate 'Repositories\code-army-client')){$root=$candidate;break}}
          }
          if(-not $root){throw 'ANDROIDBUILD_ROOT=FAIL'}
          "ANDROIDBUILD_ROOT=$root"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PHYSICAL_REPO_ROOT=$(Join-Path $root 'Repositories\code-army-client')"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
      - name: Initialize Android diagnostics
        shell: powershell
        run: |
          $dir=Join-Path $env:ANDROIDBUILD_ROOT "Builds\code-army-client\$env:EXPECTED_SOURCE_SHA\android\diagnostics"
          New-Item -ItemType Directory -Force -Path $dir|Out-Null
          Write-Host "ANDROID_DIAGNOSTICS_INIT=PASS path=$dir"
      - name: Reconfirm HARMAN AIR
        shell: powershell
        run: |
          & '.\Tools\CI\Ensure-HarmanAir502.ps1' -AndroidBuildRoot $env:ANDROIDBUILD_ROOT
      - name: Reconfirm pinned Android SDK
        shell: powershell
        run: |
          & '.\Tools\CI\Ensure-PinnedAndroidSdkRoot.ps1' -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -TargetApi '33' -BuildTools '33.0.2'
      - name: Build Android candidate
        id: android_build
        shell: powershell
        run: |
          if(-not $env:PINNED_ANDROID_BUILD_ROOT){throw 'PINNED_ANDROID_BUILD_ROOT=FAIL missing_env'}
          & '.\Tools\CI\Build-Android.ps1' -RepoRoot $env:PHYSICAL_REPO_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA -AndroidBuildRoot $env:PINNED_ANDROID_BUILD_ROOT
          $apk=Get-ChildItem (Join-Path $env:ANDROIDBUILD_ROOT "Builds\code-army-client\$env:EXPECTED_SOURCE_SHA\android") -File -Filter '*.apk'|Sort-Object Length -Descending|Select-Object -First 1
          if(-not $apk){throw 'APK_GENERATED=FAIL not_found'}
          "ANDROID_APK_PATH=$($apk.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate exact APK
        id: apk_validate
        shell: powershell
        run: |
          & '.\Tools\CI\Validate-AndroidApk.ps1' -ApkPath $env:ANDROID_APK_PATH -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA
      - name: Physical ADB validation when available
        id: adb_test
        shell: powershell
        run: |
          & '.\Tools\CI\Test-AndroidDevice.ps1' -ApkPath $env:ANDROID_APK_PATH -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA
      - name: Collect Android diagnostics
        if: always()
        shell: powershell
        run: |
          $build=Join-Path $env:ANDROIDBUILD_ROOT "Builds\code-army-client\$env:EXPECTED_SOURCE_SHA\android"
          $diag=Join-Path $build 'diagnostics'
          New-Item -ItemType Directory -Force -Path $diag|Out-Null
          Get-ChildItem -LiteralPath $build -File -Filter '*.p12' -ErrorAction SilentlyContinue|Remove-Item -Force -ErrorAction SilentlyContinue
          @(
            "REPOSITORY=$env:GITHUB_REPOSITORY"
            "EXPECTED_SOURCE_SHA=$env:EXPECTED_SOURCE_SHA"
            "RUN=$env:GITHUB_RUN_ID"
            "RUNNER_NAME=$env:RUNNER_NAME"
            "ANDROID_BUILD_OUTCOME=${{ steps.android_build.outcome }}"
            "APK_VALIDATE_OUTCOME=${{ steps.apk_validate.outcome }}"
            "ADB_TEST_OUTCOME=${{ steps.adb_test.outcome }}"
          )|Set-Content -LiteralPath (Join-Path $diag 'ci-diagnostics.txt') -Encoding UTF8
          foreach($name in @('adt-android.out.log','adt-android.err.log','ArmyAttack-android-app.xml','BUILD-PROVENANCE.json','TOOLCHAIN.json','apk-badging.txt','apk-permissions.txt','apk-signature.txt','apk-info.json','summary.json','REPORT.md')){
            $src=Join-Path $build $name
            if(Test-Path -LiteralPath $src){Copy-Item -LiteralPath $src -Destination (Join-Path $diag $name) -Force}
          }
          Write-Host "GITHUB_ARTIFACT_UPLOAD=DISABLED"
          Write-Host "LOCAL_BUILD_ROOT=$build"

  final-report:
    name: 4. Publish logs and final gate
    if: always()
    needs: [source-sync, published-audit, toolchain-preflight, reference-apk, windows-regression, android-candidate, mod-variants]
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Resolve AndroidBuild root
        shell: powershell
        run: |
          $root=$null
          foreach($drive in Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue){
            if($drive.Root){$candidate=Join-Path $drive.Root 'AndroidBuild';if(Test-Path -LiteralPath (Join-Path $candidate 'Repositories\code-army-client')){$root=$candidate;break}}
          }
          if(-not $root){throw 'ANDROIDBUILD_ROOT=FAIL'}
          "ANDROIDBUILD_ROOT=$root"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
      - name: Publish sanitized logs to repository
        id: publish_logs
        continue-on-error: true
        shell: powershell
        run: |
          & '.\Tools\CI\Publish-AndroidEvidence.ps1' -RepoCheckoutRoot $env:GITHUB_WORKSPACE -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA -RunId $env:GITHUB_RUN_ID -SourceBranch $env:SOURCE_BRANCH
      - name: Final candidate gate
        if: always()
        shell: powershell
        run: |
          Write-Host "SOURCE_SYNC=${{ needs.source-sync.result }}"
          Write-Host "PUBLISHED_AUDIT=${{ needs.published-audit.result }}"
          Write-Host "TOOLCHAIN_PREFLIGHT=${{ needs.toolchain-preflight.result }}"
          Write-Host "REFERENCE_APK=${{ needs.reference-apk.result }}"
          Write-Host "WINDOWS_REGRESSION=${{ needs.windows-regression.result }}"
          Write-Host "ANDROID_CANDIDATE=${{ needs.android-candidate.result }}"
          Write-Host "MOD_VARIANTS=${{ needs.mod-variants.result }}"
          Write-Host "LOG_PUBLISH_OUTCOME=${{ steps.publish_logs.outcome }}"
          if('${{ needs.source-sync.result }}' -ne 'success'){throw 'FINAL_VALIDATION=FAIL source_sync'}
          if('${{ needs.published-audit.result }}' -ne 'success'){throw 'FINAL_VALIDATION=FAIL published_audit'}
          if('${{ needs.toolchain-preflight.result }}' -ne 'success'){throw 'FINAL_VALIDATION=FAIL toolchain_preflight'}
          if('${{ needs.reference-apk.result }}' -ne 'success'){throw 'FINAL_VALIDATION=FAIL reference_apk'}
          if('${{ needs.windows-regression.result }}' -ne 'success'){throw 'FINAL_VALIDATION=FAIL windows_regression'}
          if('${{ needs.android-candidate.result }}' -ne 'success'){throw 'FINAL_VALIDATION=FAIL android_candidate'}
          if('${{ needs.mod-variants.result }}' -ne 'success'){throw 'FINAL_VALIDATION=FAIL mod_variants'}
          Write-Host "FINAL_VALIDATION=PASS candidate"
