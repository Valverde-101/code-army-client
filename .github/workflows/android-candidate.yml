name: Army Attack Android candidate

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'Logs/**'
  push:
    branches: [main]
    paths-ignore:
      - 'Logs/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  classify:
    name: Classify latest candidate delta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_candidate: ${{ steps.classify.outputs.run_candidate }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact PR HEAD for delta classification
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 2
          persist-credentials: false

      - name: Classify latest HEAD delta
        id: classify
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            "run_candidate=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "CANDIDATE_TRIGGER_CLASS=PUSH_OR_DISPATCH run_candidate=true sha=$env:HEAD_SHA"
            exit 0
          }

          $head=(git rev-parse HEAD).Trim()
          if ($head -ne $env:HEAD_SHA) { throw "CANDIDATE_TRIGGER_CLASS=FAIL exact_head expected=$env:HEAD_SHA actual=$head" }
          $parent=(git rev-parse HEAD^).Trim()
          if (-not $parent) { throw 'CANDIDATE_TRIGGER_CLASS=FAIL parent_missing' }
          $changed=@(git -c core.quotepath=false diff --name-only $parent $head | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($changed.Count -eq 0) { throw 'CANDIDATE_TRIGGER_CLASS=FAIL no_head_delta' }
          $sourceChanges=@($changed | Where-Object { $_ -notlike 'Logs/*' })
          if ($sourceChanges.Count -eq 0) {
            "run_candidate=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "CANDIDATE_TRIGGER_CLASS=EVIDENCE_ONLY_HEAD_DELTA run_candidate=false head=$head parent=$parent files=$($changed.Count)"
            exit 0
          }
          "run_candidate=true" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "CANDIDATE_TRIGGER_CLASS=SOURCE_HEAD_DELTA run_candidate=true head=$head parent=$parent source_files=$($sourceChanges.Count) total_files=$($changed.Count)"

      - name: Drain stale queued candidates without touching lease holders
        if: steps.classify.outputs.run_candidate == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $current=[int64]$env:GITHUB_RUN_ID
          $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?per_page=100"
          $response=Invoke-RestMethod -Headers $headers -Uri $uri -Method Get
          $stale=@($response.workflow_runs|Where-Object{
            $_.name -eq 'Army Attack Android candidate' -and
            [string]$_.head_branch -eq $env:SOURCE_BRANCH -and
            [int64]$_.id -lt $current -and
            [string]$_.status -in @('queued','pending')
          })
          $cancelled=0
          foreach($run in $stale){
            try{
              Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/cancel" -Method Post|Out-Null
              $cancelled++
              Write-Host "STALE_QUEUED_CANCELLED run=$($run.id) sha=$($run.head_sha) status=$($run.status)"
            }catch{
              Write-Host "STALE_QUEUED_CANCEL_RACE run=$($run.id) message=$($_.Exception.Message)"
            }
          }
          Write-Host "STALE_QUEUED_DRAIN=PASS cancelled=$cancelled in_progress_untouched=true branch=$env:SOURCE_BRANCH"

  candidate:
    name: Core candidate build and validation
    needs: classify
    if: needs.classify.outputs.run_candidate == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: army-attack-core-build
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Enable compatible AndroidBuild Core >= 3.0.9
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=@($env:ANDROIDBUILD_ROOT,'V:\AndroidBuild','D:\AndroidBuild','C:\AndroidBuild')|Where-Object{$_ -and (Test-Path -LiteralPath $_ -PathType Container)}|Select-Object -First 1
          if(-not $root){throw 'CORE_PRECHECK=FAIL androidbuild_root_not_found'}
          $root=(Resolve-Path -LiteralPath $root).Path
          Import-Module (Join-Path $root 'Core\Current\AndroidBuild.psd1') -DisableNameChecking -Force
          $core=[version](Get-AndroidBuildCoreVersion)
          if($core -lt [version]'3.0.9'){throw "CORE_PRECHECK=FAIL version=$core minimum=3.0.9"}
          foreach($name in @('Resolve-AndroidBuildFlashToolchain','Ensure-AndroidBuildFFDec','Invoke-AndroidBuildCandidateValidation','Invoke-AndroidBuildProcess')){if(-not(Get-Command $name -ErrorAction SilentlyContinue)){throw "CORE_PRECHECK=FAIL capability=$name"}}
          Enable-AndroidBuildPortableTools -AndroidBuildRoot $root|Out-Null
          $git=Get-AndroidBuildGitPath $root
          (Split-Path -Parent $git)|Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "ANDROIDBUILD_ROOT=$root"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CORE_PRECHECK=PASS version=$core minimum=3.0.9 flash_toolchain=true git=$git"

      - name: Bootstrap exact source without codeload
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          Import-Module (Join-Path $env:ANDROIDBUILD_ROOT 'Core\Current\AndroidBuild.psd1') -DisableNameChecking -Force
          $git=Get-AndroidBuildGitPath $env:ANDROIDBUILD_ROOT
          $workspace=$PWD.Path
          & $git config --global --add safe.directory $workspace
          if(-not(Test-Path -LiteralPath (Join-Path $workspace '.git'))){& $git init $workspace|Out-Host;if($LASTEXITCODE -ne 0){throw 'SOURCE_BOOTSTRAP=FAIL git_init'}}
          $repoUrl="https://github.com/$env:GITHUB_REPOSITORY.git"
          & $git -C $workspace remote get-url origin *> $null
          if($LASTEXITCODE -eq 0){& $git -C $workspace remote set-url origin $repoUrl}else{& $git -C $workspace remote add origin $repoUrl}
          $pair="x-access-token:$env:GITHUB_TOKEN";$basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair));$extra="AUTHORIZATION: basic $basic"
          & $git -C $workspace -c "http.https://github.com/.extraheader=$extra" fetch --force --no-tags origin $env:EXPECTED_SOURCE_SHA
          if($LASTEXITCODE -ne 0){throw 'SOURCE_BOOTSTRAP=FAIL fetch'}
          & $git -C $workspace checkout --detach --force $env:EXPECTED_SOURCE_SHA
          if($LASTEXITCODE -ne 0){throw 'SOURCE_BOOTSTRAP=FAIL checkout'}
          & $git -C $workspace clean -fdx
          if($LASTEXITCODE -ne 0){throw 'SOURCE_BOOTSTRAP=FAIL clean'}
          $head=(& $git -C $workspace rev-parse HEAD).Trim()
          if($head -ne $env:EXPECTED_SOURCE_SHA){throw "SOURCE_BOOTSTRAP=FAIL expected=$env:EXPECTED_SOURCE_SHA actual=$head"}
          Write-Host "SOURCE_BOOTSTRAP=PASS sha=$head"

      - name: Validate Army Core hooks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($script in @('.\.github\scripts\armyattack-project-precheck.ps1','.\.github\scripts\armyattack-workspace.ps1','.\.github\scripts\armyattack-build.ps1','.\.github\scripts\publish-armyattack-project-source.ps1','.\Tools\CI\Build-Android.ps1','.\Tools\CI\Validate-AndroidApk.ps1','.\Tools\CI\Patch-AndroidPerformanceSwf.ps1','.\Tools\SWF\Ensure-FFDec.ps1','.\Tools\CI\Ensure-HarmanAir502.ps1','.\Tools\CI\Ensure-PortableJdk17.ps1','.\Tools\CI\Ensure-PinnedAndroidSdkRoot.ps1')){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors)
            if(@($errors).Count -gt 0){$errors|ForEach-Object{Write-Host "PARSER_ERROR file=$script line=$($_.Extent.StartLineNumber) message=$($_.Message)"};throw "PARSER_VALID=FAIL file=$script"}
            Write-Host "PARSER_VALID=PASS file=$script"
          }

      - name: Validate Army AndroidBuild project contract
        shell: powershell
        run: |
          & '.\.github\scripts\armyattack-project-precheck.ps1'

      - name: Build and validate Army candidate through compatible Core
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $checkout=$PWD.Path
          Import-Module (Join-Path $env:ANDROIDBUILD_ROOT 'Core\Current\AndroidBuild.psd1') -DisableNameChecking -Force
          $git=Get-AndroidBuildGitPath $env:ANDROIDBUILD_ROOT
          $checkoutSha=(& $git -C $checkout rev-parse HEAD).Trim()
          if($checkoutSha -ne $env:EXPECTED_SOURCE_SHA){throw "STALE_TEST_RESULT checkout=$checkoutSha expected=$env:EXPECTED_SOURCE_SHA"}
          $persistent=Join-Path $env:ANDROIDBUILD_ROOT 'Repositories\code-army-client'
          $pr=if([string]::IsNullOrWhiteSpace($env:PR_NUMBER)){0}else{[int]$env:PR_NUMBER}
          $projectConfig=Get-Content -LiteralPath (Join-Path $checkout '.androidbuild.json') -Raw|ConvertFrom-Json
          $leaseWait=[int]$projectConfig.timeouts.build_lease_wait_seconds
          if($leaseWait -lt 30 -or $leaseWait -gt 600){throw "BUILD_LEASE_WAIT=FAIL seconds=$leaseWait allowed=30..600"}
          Write-Host "BUILD_LEASE_WAIT=PASS seconds=$leaseWait serialization=army-attack-core-build"
          $result=Invoke-AndroidBuildCandidateValidation -RepoRoot $persistent -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -ExpectedSha $env:EXPECTED_SOURCE_SHA -Repository $env:GITHUB_REPOSITORY -PrNumber $pr -SourceRemote $checkout -PackageName 'air.army.attack' -LeaseWaitSeconds $leaseWait

          $pair="x-access-token:$env:GITHUB_TOKEN";$basic=[Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair));$extra="AUTHORIZATION: basic $basic"
          $probe=Invoke-AndroidBuildProcess -FilePath $git -ArgumentList @('-C',$checkout,'-c',"http.https://github.com/.extraheader=$extra",'ls-remote','origin',("refs/heads/"+$env:SOURCE_BRANCH)) -WorkingDirectory $checkout -TimeoutSeconds 30 -Environment @{GIT_TERMINAL_PROMPT='0';GCM_INTERACTIVE='Never'} -AllowNonZeroExit
          $line=([string]$probe.stdout).Trim()
          if($probe.exit_code -ne 0 -or [string]::IsNullOrWhiteSpace($line)){throw "APK_CANDIDATE_HEAD_RECHECK=FAIL exit=$($probe.exit_code)"}
          $remote=(($line -split '\s+')[0]).Trim()
          if($remote -ne $env:EXPECTED_SOURCE_SHA){throw "STALE_TEST_RESULT remote_head=$remote expected=$env:EXPECTED_SOURCE_SHA"}

          $metaPath=Join-Path $persistent '.work\artifacts\android\armyattack-build.json'
          if(-not(Test-Path -LiteralPath $metaPath)){throw "CORE_CANDIDATE=FAIL metadata_missing=$metaPath"}
          $meta=Get-Content -LiteralPath $metaPath -Raw|ConvertFrom-Json
          if([string]$meta.source_sha -ne $env:EXPECTED_SOURCE_SHA){throw 'CORE_CANDIDATE=FAIL metadata_sha'}
          $hookCore=[version]([string]$meta.core_version)
          if($hookCore -lt [version]'3.0.9'){throw "CORE_CANDIDATE=FAIL hook_core=$hookCore minimum=3.0.9"}
          $provenanceCore=[version]([string]$result.build.provenance.core_version)
          if($hookCore -ne $provenanceCore){throw "CORE_CANDIDATE=FAIL core_provenance_mismatch hook=$hookCore provenance=$provenanceCore"}
          if([string]$meta.toolchain_ownership -ne 'androidbuild-global'){throw "CORE_CANDIDATE=FAIL toolchain_ownership=$($meta.toolchain_ownership)"}
          if([string]$meta.workspace.build_root -notlike (Join-Path $persistent '.work\build*')){throw "CORE_CANDIDATE=FAIL workspace_build_root=$($meta.workspace.build_root)"}
          if([int]$meta.workspace.retention_generations -ne 3){throw "CORE_CANDIDATE=FAIL workspace_retention=$($meta.workspace.retention_generations)"}
          $apk=[string]$result.apk_path;$hash=(Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToUpperInvariant()
          if($hash -ne ([string]$result.apk.identity.sha256).ToUpperInvariant()){throw 'CORE_CANDIDATE=FAIL apk_hash'}
          Write-Host "CORE_BUILD_PROVENANCE=PASS core=$provenanceCore minimum=3.0.9"
          Write-Host "ARMY_FLASH_TOOLCHAIN_OWNERSHIP=$($meta.toolchain_ownership)"
          Write-Host "ARMY_WORKSPACE_OWNERSHIP=PASS build=$($meta.workspace.build_root) cache=$($meta.workspace.input_cache_root) scratch=$($meta.workspace.scratch_root) retention=$($meta.workspace.retention_generations)"
          Write-Host "ARMY_AIR_VERSION=$($meta.air_version)"
          Write-Host "ARMY_FFDEC_VERSION=$($meta.ffdec_version)"
          Write-Host "APK_PACKAGE=$($result.apk.identity.package_name)"
          Write-Host "APK_SIZE=$($result.apk.identity.bytes)"
          Write-Host "APK_SHA256=$hash"
          Write-Host "APK_CANDIDATE_REMOTE_HEAD=$remote"
          Write-Host 'APK_CANDIDATE_HEAD_RECHECK=PASS'
          Write-Host 'CANDIDATE_VALIDATION=PASS'
          Write-Host 'PHYSICAL_VALIDATION=NOT_ACTIVATED'
          Write-Host 'MANUAL_PHYSICAL_PROFILE=Recording starts automatically; PERF only opens or closes the metrics panel'
          Write-Host 'MANUAL_PHYSICAL_ZIP=Press ZIP to share a snapshot without stopping the recording'
          Write-Host 'FINAL_VALIDATION=VALIDATION_INCOMPLETE physical_validation_required'
          Write-Host 'APK_FINAL_PUBLICATION=DEFERRED_UNTIL_PHYSICAL_VALIDATION'
