name: Bootstrap Army Attack physical clone

on:
  push:
    branches:
      - chore/local-army-bootstrap-20260827
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: army-attack-physical-clone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-physical-clone:
    name: Sync exact HEAD into AndroidBuild Repositories
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      SOURCE_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Bootstrap portable Git
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $candidates=New-Object System.Collections.Generic.List[string]
          function Add-Candidate([string]$p){if($p -and -not $candidates.Contains($p)){$candidates.Add($p)}}
          $existing=Get-Command git.exe -ErrorAction SilentlyContinue
          if($existing){Add-Candidate $existing.Source}
          if($env:ProgramFiles){Add-Candidate (Join-Path $env:ProgramFiles 'Git\cmd\git.exe')}
          foreach($drive in Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue){
            if($drive.Root){
              foreach($relative in @(
                'AndroidBuild\Tools\Git\cmd\git.exe',
                'AndroidBuild\PortableGit\cmd\git.exe',
                'Git\cmd\git.exe'
              )){
                Add-Candidate (Join-Path $drive.Root $relative)
              }
            }
          }
          $git=$candidates|Where-Object{Test-Path -LiteralPath $_}|Select-Object -First 1
          if(-not $git){throw ('PRECHECK_GIT=FAIL git.exe not found. Probed: '+($candidates -join '; '))}
          $gitDir=Split-Path -Parent $git
          $gitDir|Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH="$gitDir;$env:PATH"
          & $git config --global core.longPaths true
          Write-Host "PRECHECK_GIT=PASS path=$git"

      - name: Checkout exact workflow HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact Actions checkout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $actual=(git rev-parse HEAD).Trim()
          if($actual -ne $env:EXPECTED_SOURCE_SHA){
            throw "EXACT_ACTIONS_HEAD=FAIL expected=$env:EXPECTED_SOURCE_SHA actual=$actual"
          }
          Write-Host "PRECHECK_GITHUB=PASS"
          Write-Host "BROKER=PASS runner=$env:RUNNER_NAME"
          Write-Host "RUNNER_ASSIGNMENT=PASS runner=$env:RUNNER_NAME"
          Write-Host "EXACT_ACTIONS_HEAD=PASS sha=$actual"
          Write-Host "REPOSITORY=$env:GITHUB_REPOSITORY"
          Write-Host "BRANCH=$env:SOURCE_BRANCH"
          Write-Host "EXPECTED_SOURCE_SHA=$env:EXPECTED_SOURCE_SHA"
          Write-Host "RUN=$env:GITHUB_RUN_ID"
          Write-Host "JOB_ID=$env:GITHUB_JOB"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"

      - name: Synchronize canonical physical repository
        shell: powershell
        run: |
          & '.\Tools\CI\Bootstrap-PhysicalClone.ps1' `
            -Repository $env:GITHUB_REPOSITORY `
            -ExpectedSha $env:EXPECTED_SOURCE_SHA `
            -SourceBranch $env:SOURCE_BRANCH

      - name: Resolve AndroidBuild root for Windows build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=$null
          foreach($drive in Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue){
            if(-not $drive.Root){continue}
            $candidate=Join-Path $drive.Root 'AndroidBuild'
            if((Test-Path -LiteralPath (Join-Path $candidate 'Repositories\code-army-client'))){
              $root=$candidate
              break
            }
          }
          if(-not $root){throw 'ANDROIDBUILD_ROOT=FAIL unable to resolve canonical root'}
          "ANDROIDBUILD_ROOT=$root"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PHYSICAL_REPO_ROOT=$(Join-Path $root 'Repositories\code-army-client')"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ANDROIDBUILD_ROOT=PASS root=$root"

      - name: Validate exact-source upstream Windows reference
        id: upstream_reference
        shell: powershell
        run: |
          & '.\Tools\CI\Validate-UpstreamWindowsRelease.ps1' `
            -AndroidBuildRoot $env:ANDROIDBUILD_ROOT `
            -ExpectedSha $env:EXPECTED_SOURCE_SHA

      - name: Diagnostic source-only recompilation
        id: source_rebuild
        continue-on-error: true
        shell: powershell
        run: |
          & '.\Tools\CI\Build-Windows.ps1' `
            -RepoRoot $env:PHYSICAL_REPO_ROOT `
            -ExpectedSha $env:EXPECTED_SOURCE_SHA `
            -AndroidBuildRoot $env:ANDROIDBUILD_ROOT

      - name: Assemble and validate full Windows candidate
        id: full_candidate
        shell: powershell
        run: |
          & '.\Tools\CI\Build-WindowsFullCandidate.ps1' `
            -RepoRoot $env:PHYSICAL_REPO_ROOT `
            -ExpectedSha $env:EXPECTED_SOURCE_SHA `
            -AndroidBuildRoot $env:ANDROIDBUILD_ROOT

      - name: Measure full candidate performance
        id: performance
        shell: powershell
        run: |
          & '.\Tools\CI\Measure-WindowsPerformance.ps1' `
            -AndroidBuildRoot $env:ANDROIDBUILD_ROOT `
            -ExpectedSha $env:EXPECTED_SOURCE_SHA `
            -DurationSeconds 20 `
            -SampleSeconds 2

      - name: Final gate
        if: always()
        shell: powershell
        run: |
          Write-Host "SOURCE_REBUILD_OUTCOME=${{ steps.source_rebuild.outcome }}"
          Write-Host "UPSTREAM_REFERENCE_OUTCOME=${{ steps.upstream_reference.outcome }}"
          Write-Host "FULL_CANDIDATE_OUTCOME=${{ steps.full_candidate.outcome }}"
          Write-Host "PERFORMANCE_OUTCOME=${{ steps.performance.outcome }}"
          Write-Host "APK_GENERATED=NOT_RUN"
          Write-Host "PHYSICAL_ANDROID_VALIDATION=NOT_RUN"
          if ('${{ steps.upstream_reference.outcome }}' -ne 'success') { throw 'FINAL_VALIDATION=FAIL upstream_reference' }
          if ('${{ steps.full_candidate.outcome }}' -ne 'success') { throw 'FINAL_VALIDATION=FAIL full_candidate' }
          if ('${{ steps.performance.outcome }}' -ne 'success') { throw 'FINAL_VALIDATION=FAIL performance' }
          Write-Host "FINAL_VALIDATION=PASS windows_full_candidate"
